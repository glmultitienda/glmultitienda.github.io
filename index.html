.sell-body b{display:block;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sell-meta{font-size:10.5px;color:var(--mu);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sell-price{font-size:12px;font-weight:800;color:var(--ok);margin-top:3px;font-variant-numeric:tabular-nums}
.sell-price span{color:var(--mu);font-weight:600}
.sell-actions{display:flex;flex-direction:column;align-items:flex-end;gap:5px;flex:none}
.cart-card{position:sticky;top:calc(var(--top) + 16px);background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh)}
.cart-card h3{margin:0;font-size:16px;letter-spacing:-.2px}
.cart-item{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--bd)}
.cart-item:last-of-type{border-bottom:0}
.cart-name{font-size:12.5px;font-weight:700;line-height:1.3}
.cart-sub{font-size:10.5px;color:var(--mu);display:flex;align-items:center;gap:4px;margin-top:3px}
.cart-sub input{width:72px;padding:4px 6px;min-height:30px;font-size:11.5px}
.qty{display:inline-flex;align-items:center;border:1px solid var(--bd);border-radius:9px;overflow:hidden;background:var(--card)}
.qty button{border:0;background:var(--bg2);color:var(--tx2);width:28px;height:30px;font-weight:800;cursor:pointer;font-size:13px;padding:0}
.qty input{width:34px;border:0;border-radius:0;text-align:center;padding:4px;min-height:30px;font-size:11.5px;background:transparent}
.cart-total{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0 4px;font-size:12.5px;color:var(--mu)}
.cart-total b{font-size:24px;color:var(--tx);letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.list-card{display:flex;flex-direction:column;gap:8px}
.doc-row{display:flex;align-items:center;gap:13px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:13px 15px;box-shadow:var(--sh-sm);cursor:pointer;transition:border-color 160ms ease,box-shadow 160ms ease,transform 160ms var(--eo)}
.doc-row:hover{border-color:color-mix(in srgb,var(--acc) 35%,var(--bd));box-shadow:var(--sh);transform:translateY(-1px)}
.doc-ico{width:40px;height:40px;border-radius:11px;background:color-mix(in srgb,var(--acc) 10%,transparent);display:grid;place-items:center;color:var(--acc);flex:none}
.doc-ico.ok{background:color-mix(in srgb,var(--ok) 11%,transparent);color:var(--ok)}
.doc-ico.warn{background:color-mix(in srgb,var(--wa) 13%,transparent);color:var(--wa)}
.doc-main{flex:1;min-width:0}
.doc-title{font-size:13.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doc-meta{font-size:11px;color:var(--mu);display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
.doc-amount{font-size:14px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.doc-meta .ic{width:12px;height:12px;vertical-align:-2px}
.box table input{min-height:36px;padding:7px 8px;font-size:12.5px}
.box table .btn.s{min-height:28px;padding:3px 7px}
.box table .btn.s .ic{width:13px;height:13px}
#lock .box .brand-txt b{font-size:15px}
@media(max-width:640px){
 .topbar-actions .chip{padding:7px 9px;gap:5px}
 .topbar-actions .chip span{max-width:76px;overflow:hidden;text-overflow:ellipsis}
 .page-toolbar{gap:8px}
 .toolbar-actions{margin-left:0;width:100%;justify-content:flex-end}
 .toolbar-actions .btn{flex:1 1 auto}
 .toolbar-actions .btn:only-child{flex:0 0 auto}
 .doc-meta{font-size:10.5px;gap:4px}
 .client-actions .btn{font-size:11.5px}
}
.client-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:12px}
.client-card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r-lg);padding:14px;box-shadow:var(--sh-sm);display:flex;flex-direction:column;gap:10px;transition:transform 150ms var(--eo),box-shadow 180ms ease}
.client-card:hover{transform:translateY(-2px);box-shadow:var(--sh)}
.client-top{display:flex;gap:10px;align-items:center}
.client-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,color-mix(in srgb,var(--acc) 16%,transparent),color-mix(in srgb,var(--ok) 13%,transparent));display:grid;place-items:center;color:var(--acc);font-weight:800;font-size:13px;flex:none}
.client-name{font-size:13.5px;font-weight:800;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.client-meta{font-size:10.5px;color:var(--mu);margin-top:2px}
.client-stats{display:flex;justify-content:space-between;gap:8px;background:var(--card2);border-radius:10px;padding:8px 10px;font-size:10.5px;color:var(--mu)}
.client-stats b{display:block;font-size:13px;color:var(--tx);font-variant-numeric:tabular-nums;margin-top:1px}
.client-actions{display:flex;gap:6px}
.client-actions .btn{flex:1}
@media(min-width:1300px){
 .grid{grid-template-columns:repeat(5,minmax(0,1fr))}
}
@media(max-width:1180px){
 .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

 .cart-card{position:static}
}

 .kpi-icon{width:32px;height:32px;margin-bottom:8px}

 .client-grid{grid-template-columns:1fr}

 .box{padding:18px;border-radius:20px}
}
@media(max-width:420px){
 .kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}

<style>
/* base */
:host{display:block;height:100%;color-scheme:light}
.lk-page{height:100%;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scroll-padding-top:84px;-webkit-overflow-scrolling:touch}

/* portada */


:host{
  --navy:#0e2745;--navy2:#071a30;--navy3:#153a63;
  --green:#10b981;--green2:#0d9488;--blue:#2f86d6;
  --bg:#f5f8fc;--card:#fff;--bd:#e2eaf3;--bd2:#cfdceb;
  --tx:#0f2745;--tx2:#3c5570;--mu:#63799a;
  --shadow:0 1px 2px rgba(15,39,69,.05),0 12px 32px rgba(15,39,69,.07);
  --shadow-lg:0 24px 70px rgba(9,28,52,.18);
  --r:18px;--eo:cubic-bezier(.2,.8,.2,1);
  --ff:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
:host{scroll-behavior:smooth;scroll-padding-top:84px}
:host{margin:0;font-family:var(--ff);background:var(--bg);color:var(--tx);line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;height:auto;display:block}
a{color:inherit}
h1,h2,h3,h4{margin:0;line-height:1.12;letter-spacing:-.025em;font-weight:800}
p{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 55%,transparent);outline-offset:3px;border-radius:8px}
.skip{position:absolute;left:-9999px;top:0;background:var(--navy);color:#fff;padding:10px 16px;border-radius:0 0 10px 0;z-index:100}
.skip:focus{left:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--green2)}
.lead{font-size:17px;color:var(--tx2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:14px 22px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:transform .15s var(--eo),box-shadow .2s ease,background-color .2s ease,color .2s ease}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(0) scale(.99)}
.btn.primary{background:linear-gradient(135deg,var(--green),var(--green2));color:#04261d;box-shadow:0 10px 24px rgba(16,185,129,.28)}
.btn.primary:hover{box-shadow:0 14px 30px rgba(16,185,129,.36)}
.btn.ghost{background:#fff;border-color:var(--bd2);color:var(--navy)}
.btn.ghost:hover{border-color:#9db6d2;box-shadow:var(--shadow)}
.btn.wa{background:#0f2a47;color:#fff;box-shadow:0 10px 24px rgba(9,28,52,.22)}
.btn.wa:hover{background:#123a61}
.btn.sm{padding:10px 16px;font-size:13.5px;border-radius:10px}
.ic{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}

header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,#fff 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid color-mix(in srgb,var(--bd) 75%,transparent)}

<script>
let LOGO=null,CL=[],db={parts:[],notes:[],compras:[],gastos:[],creditos:[],cierres:[]},R=null,mig=false,view='dash',q='',cart=[],client={name:'',phone:'',ci:''},mlFil='all';
let USER=null,synced=false,mediaWarned=false,payMethod='Efectivo',repP='hoy',payTier='bcv',invF='all',notesAll=false,SEQ=0,RATE=0,RATE_MAN=false,RATE_INFO=null,bsMan=null,gP='mes',gFil='all',fFil='pend',ventaVence='',SET={par:0,difMan:'',disc:20,ml:13,oth:2,mode:'sum',autoRecalc:true};
const PAYS=['Efectivo','Pago móvil','Transferencia','Punto de venta','Zelle','Otro','Crédito'];
const ADMINS=[]; // correos con acceso a costos y ganancias (vacío = todos)
const isAdmin=()=>!ADMINS.length||(USER&&ADMINS.includes((USER.email||'').toLowerCase()));
const DL={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
const $=s=>document.querySelector(s);
const ico=(n,cls='ic')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
try{const s=localStorage.getItem('glm_db');if(s){db=JSON.parse(s);db.notes=db.notes||[]}}catch(e){}
db.gastos=db.gastos||[];
const LOC=JSON.parse(JSON.stringify(db));
try{const t=localStorage.getItem('glm_logo');if(t)LOGO=JSON.parse(t)}catch(e){}
const se=e=>alert('No se pudo sincronizar: '+((e&&e.message)||'error'));
function commit(ps=[],ns=[]){if(!R)return save();const c=o=>JSON.parse(JSON.stringify(o));ps.forEach(p=>R.doc('parts/'+p.id).set(c(p)).catch(se));ns.forEach(n=>R.doc('notes/'+n.no).set(c(n)).catch(se));return true}
function patchParts(list){
 if(!R)return save();
 const c=o=>JSON.parse(JSON.stringify(o));
 list.forEach(([id,patch])=>R.doc('parts/'+id).set(c(patch),{merge:true}).catch(se));
 return true;
}
const MEDIA_KEY='glm_media';
function mediaShadow(){try{return JSON.parse(localStorage.getItem(MEDIA_KEY)||'{}')}catch(e){return{}}}
function saveMedia(p){
 try{
  const m=mediaShadow(),e=m[p.id]||{};
  if(p.img!==undefined)e.img=p.img;
  if(p.mlpub!==undefined)e.mlpub=!!p.mlpub;
  e.name=p.name||e.name||'';e.code=p.code||e.code||'';e.ts=Date.now();m[p.id]=e;
  try{localStorage.setItem(MEDIA_KEY,JSON.stringify(m))}
  catch(err){
   const ids=Object.keys(m).sort((a,b)=>(m[a].ts||0)-(m[b].ts||0));
   ids.slice(0,Math.max(1,Math.ceil(ids.length/3))).forEach(k=>delete m[k]);
   localStorage.setItem(MEDIA_KEY,JSON.stringify(m));
  }
 }catch(e){}
}
function mediaDiff(){
 const m=mediaShadow(),out=[];
 db.parts.forEach(p=>{const s=m[p.id];if(!s)return;const patch={};
  if(s.img&&s.img!==p.img)patch.img=s.img;
  if(s.mlpub&&!p.mlpub)patch.mlpub=true;
  if(Object.keys(patch).length)out.push([p.id,patch]);
 });
 return out;
}
function restoreMedia(){
 const list=mediaDiff();
 if(!list.length){alert('No hay fotos ni marcas de MercadoLibre guardadas en este equipo que falten en la nube.');return}
 if(!confirm('Restaurar fotos y marcas de MercadoLibre guardadas en este equipo para '+list.length+' '+pl(list.length,'repuesto','repuestos')+'?'))return;
 list.forEach(([id,patch])=>{const p=find(id);if(p)Object.assign(p,patch)});
 patchParts(list);render();alert('Restaurado en '+list.length+' '+pl(list.length,'repuesto','repuestos')+'.');
}
function save(){if(R)return true;try{localStorage.setItem('glm_db',JSON.stringify(db));return true}catch(e){alert('No se pudo guardar (almacenamiento lleno). Exporta un respaldo y usa fotos más pequeñas.');return false}}
const find=id=>db.parts.find(p=>p.id===id);
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const match=p=>{const h=nz(p.name+' '+p.code+' '+p.brand);return nz(q).split(/\s+/).filter(Boolean).every(w=>h.includes(w))};
const tag=p=>p.stock<=0?'<span class="tag zero">Agotado</span>':p.stock<=1?`<span class="tag low">Quedan ${p.stock}</span>`:`<span class="tag">${p.stock} en stock</span>`;
const pic=p=>p.img?`<img src="${p.img}" alt="" style="cursor:zoom-in" onclick="zoom('${p.id}')">`:'<div class="ph">⚙️</div>';

const PAGE_META={dash:['Resumen','Tu negocio de un vistazo'],inv:['Inventario','Stock, precios y publicación'],sell:['Vender','Arma la venta y genera la nota'],compras:['Compras','Proveedores y notas de compra'],notes:['Notas','Notas de entrega emitidas'],cli:['Clientes','Historial y contacto'],gastos:['Gastos','Alquiler, sueldos y gastos del mes'],creditos:['Créditos','Cuentas por cobrar y abonos'],caja:['Cierre de caja','Cuadre del día y arqueo'],rep:['Reportes','Ventas, gastos y utilidad']};

function updateTopbar(){
 const m=PAGE_META[view]||PAGE_META.dash,t=$('#pageTitle'),s=$('#pageSub');
 if(t)t.textContent=m[0];
 if(s){
  if(view==='dash')s.textContent=new Date().toLocaleDateString('es',{weekday:'long',day:'numeric',month:'long'});
  else if(view==='inv'){const out=db.parts.filter(p=>p.stock<=0).length;s.textContent=db.parts.length+' '+pl(db.parts.length,'repuesto','repuestos')+(out?' · '+out+' agotado'+pl(out,'','s'):'');}
  else if(view==='compras'){const n=(db.compras||[]).length;s.textContent=n+' '+pl(n,'nota de compra registrada','notas de compra registradas');}
  else if(view==='notes'){const n=db.notes.length;s.textContent=n+' '+pl(n,'nota emitida','notas emitidas');}
 else if(view==='gastos'){const t=sumGastos(...gRange()),p=(db.gastos||[]).filter(g=>!g.pagado).length;s.textContent=money(t)+' en el período'+(p?' · '+p+' por pagar':'');}
  else if(view==='creditos'){const n=fPendList().length;s.textContent=n?money(fCobrar())+' por cobrar · '+n+' '+pl(n,'crédito','créditos'):'Sin deudas pendientes';}
  else if(view==='caja'){s.textContent=cajaDay===dISO(0)?'Cuadre de hoy':fFec(cajaDay);}
  else if(view==='cli'){const n=clients().length;s.textContent=n+' '+pl(n,'cliente con compras','clientes con compras');}
  else s.textContent=m[1];
 }
 const mb=$('#moreBtn2');if(mb)mb.classList.toggle('on',['compras','cli','rep','gastos','creditos','caja'].includes(view));
}
function goView(v){
 view=v;q='';toggleMore(false);
 document.querySelectorAll('[data-v]').forEach(x=>x.classList.toggle('on',x.dataset.v===v));
 render();window.scrollTo({top:0,behavior:'smooth'});
}
function toggleMore(force){
 const s=$('#moreSheet'),b=$('#sheetBackdrop'),btn=$('#moreBtn');if(!s)return;
 const on=force===false?false:force===true?true:!s.classList.contains('on');
 s.classList.toggle('on',on);if(b)b.classList.toggle('on',on);if(btn)btn.setAttribute('aria-expanded',on?'true':'false');
}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>goView(b.dataset.v));

function render(){
 if(view==='dash')renderDash();else if(view==='inv')renderInv();else if(view==='compras')renderCompras();else if(view==='sell')renderSell();else if(view==='cli')renderCli();else if(view==='gastos')renderGastos();else if(view==='creditos')renderCreditos();else if(view==='caja')renderCaja();else if(view==='rep')renderRep();else renderNotes();
 updateTopbar();
}

/* ---------- RESUMEN ---------- */
const startOf=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const notesIn=(a,b)=>db.notes.filter(n=>!n.void&&new Date(n.date)>=a&&new Date(n.date)<b);
const sumTot=l=>l.reduce((a,n)=>a+(+n.total||0),0);
const noteProfit=n=>(n.items||[]).reduce((a,i)=>a+(i.cost!=null?(+i.qty||0)*((+i.price||0)-(+i.cost||0)):0),0);
const PALETTE=['var(--acc)','var(--ok)','var(--wa)','var(--purple)','var(--danger)','var(--mu)'];
const phead=(t,s,extra='')=>`<div class="panel-head"><div><h3 class="panel-title">${t}</h3><p class="panel-sub">${s}</p></div>${extra}</div>`;
function moneyShort(v){v=+v||0;if(v>=1000)return '$'+(v/1000).toLocaleString('de-DE',{maximumFractionDigits:1})+'k';return '$'+v.toLocaleString('de-DE',{maximumFractionDigits:0})}
function payEntries(list){
 const m=new Map();list.forEach(n=>{const k=n.pay||'Sin especificar';m.set(k,(m.get(k)||0)+(+n.total||0))});
 return [...m.entries()].sort((a,b)=>b[1]-a[1]);
}
function donutHtml(entries,tot){

async function fetchRate(force){
 if(RATE_MAN&&!force)return false;
 const srcs=[
  ['https://api-dolar.leandrus.net/v1/dolares/oficial/siguiente','json'],
  ['https://api-dolar.leandrus.net/v1/dolares/oficial','json'],
  ['https://ve.dolarapi.com/v1/dolares/oficial','json'],
  ['https://api.allorigins.win/raw?url='+encodeURIComponent('https://www.bcv.org.ve/'),'bcv']];
 for(const [u,k] of srcs){
  try{
   const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
   const res=await fetch(u,{signal:ctl.signal});clearTimeout(t);if(!res.ok)continue;
   let v=0,fecha='';
   if(k==='json'){const j=await res.json();v=+(j.promedio??j.venta);fecha=String(j.fechaActualizacion||'').slice(0,10)}
   else{const m=(await res.text()).match(/id="dolar"[\s\S]*?<strong>\s*([\d.,]+)\s*<\/strong>/);if(m)v=+m[1].replace(/\./g,'').replace(',','.')}
   if(v>1&&v<1e6){RATE=v;RATE_MAN=false;RATE_INFO={fecha,src:k==='bcv'?'bcv.org.ve (vía proxy)':new URL(u).hostname+(u.endsWith('/siguiente')?' (próxima fecha valor)':'')};saveRate();rateUI();maybeAutoRecalc('tasa BCV actualizada');return true}
  }catch(e){}
 }
 rateUI();return false;
}

function pf(n){return (+n||0).toLocaleString('de-DE',{maximumFractionDigits:2})+'%'}
function pl(n,one,many){return (+n===1?one:many)}
function autoDif(){return RATE&&+SET.par>RATE?(SET.par/RATE-1)*100:0}
function difPct(){return SET.difMan!==''&&SET.difMan!=null&&!isNaN(+SET.difMan)?+SET.difMan:autoDif()}
function cashOf(bcv){return Math.round((+bcv||0)*(1-(+SET.disc||0)/100)*100)/100}
function mlF(mode){const a=(+SET.ml||0)/100,b=(+SET.oth||0)/100;return mode==='net'?1/((1-a)*(1-b)):(1+a)*(1+b)}
function mlPrice(cash){return cash*mlF(SET.mode)}
function mlFmt(n){return n.toLocaleString('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4})}
function mlTxt(v){v=+v;return v>0?(RATE?'≈ Bs '+bsf(v*RATE)+' al BCV · ':'')+'CASH '+mlFmt(mlF(SET.mode))+' (× '+pf(SET.ml)+' y luego × '+pf(SET.oth)+')':''}

 <div style="display:flex;gap:8px"><div style="flex:1"><label>MercadoLibre comisión %</label><input id="s_ml" type="number" step="0.01" inputmode="decimal" value="${SET.ml}"></div><div style="flex:1"><label>Mercasist %</label><input id="s_oth" type="number" step="0.01" inputmode="decimal" value="${SET.oth}"></div></div>
 <div class="mu">El precio de MercadoLibre sale del <b>precio CASH</b>: primero se suma el ${pf(SET.ml)} de MercadoLibre y <b>sobre ese resultado</b> se suma el ${pf(SET.oth)} de Mercasist. No es lo mismo que sumar ${pf((+SET.ml||0)+(+SET.oth||0))} de una sola vez. No incluye el diferencial paralelo.</div>
 <label>Cómo aplicar las comisiones de MercadoLibre</label><select id="s_mode"><option value="sum" ${SET.mode==='sum'?'selected':''}>Sumar en cascada: CASH × ${mlFmt(mlF('sum'))}</option><option value="net" ${SET.mode==='net'?'selected':''}>Compensar y recibir el CASH completo: CASH ÷ ${mlFmt(1/mlF('net'))}</option></select>
<label class="mu" style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:8px"><input type="checkbox" id="s_auto" ${SET.autoRecalc?'checked':''} style="width:auto;height:auto;min-height:0"> Recalcular precios automáticamente al cambiar tasas o comisiones</label>
 <div class="row" style="margin-top:16px"><button class="btn" onclick="saveSet()">${ico('check')} Guardar</button><button class="btn g" onclick="closeM()">Cancelar</button></div>
 <div class="row"><button class="btn g s" onclick="recalcAsk()">${ico('refresh')} Recalcular los precios de todos los repuestos</button></div>`;
 $('#modal').classList.add('on');
}
function saveSet(){
 const old=difPct(),oldMl=SET.ml,oldOth=SET.oth,oldMode=SET.mode,g=i=>document.getElementById(i).value;
 SET={par:+g('s_par')||0,difMan:g('s_dif')===''?'':+g('s_dif'),disc:+g('s_disc')||0,ml:+g('s_ml')||0,oth:+g('s_oth')||0,mode:g('s_mode'),autoRecalc:document.getElementById('s_auto').checked};
 storeSet();parUI();closeM();
 const diffChanged=Math.abs(difPct()-old)>0.005;
 const mlChanged=SET.ml!==oldMl||SET.oth!==oldOth||SET.mode!==oldMode;
 if(db.parts.length&&(diffChanged||mlChanged))maybeAutoRecalc(diffChanged?'ajustes de tasas':'comisiones ML');else render();
}
function toast(msg){const t=document.createElement('div');t.textContent=msg;t.style.cssText='position:fixed;bottom:'+(innerWidth<=900?'88px':'24px')+';left:50%;transform:translateX(-50%);background:var(--pr);color:#fff;padding:12px 20px;border-radius:10px;box-shadow:var(--sh);z-index:9999;animation:toastIn .3s var(--eo)';document.body.appendChild(t);setTimeout(()=>{t.style.animation='toastOut .3s var(--eo) forwards';setTimeout(()=>t.remove(),300)},3000)}
function recalcAsk(old){
 const n=db.parts.length;if(!n){alert('No hay repuestos.');return}
 const dp=difPct();
 if(dp>100&&!confirm('Ojo: el diferencial ha quedado en '+pf(dp)+'. Puede ser real o puede que la tasa paralela esté mal escrita.\n\nSi la tasa paralela está mal, al dejar vacío el diferencial manual el precio BCV se multiplicaría por un número enorme.\n\n¿Recalcular de todos modos?')){render();return}
 if(confirm('¿Recalcular los precios BCV, CASH y MercadoLibre de '+n+' '+pl(n,'repuesto','repuestos')+' con el diferencial actual ('+pf(dp)+')?'+(old!=null?' Antes era '+pf(old)+'.':'')+'\nLos precios CASH y MercadoLibre que fijaste a mano no se tocan.'))recalcAll();else render();
}
function recalcAll(silent,reason){
 const d=1+difPct()/100,ps=[];
 db.parts.forEach(p=>{const base=p.base??pr(p,'bcv'),nb=Math.round(base*d*100)/100;
  const patch={base,pbcv:nb,price:nb};
  p.base=base;p.pbcv=nb;p.price=nb;
  if(!p.cman){p.pcash=cashOf(nb);patch.pcash=p.pcash}
  if(!p.mman){p.pml=Math.round(mlPrice(p.pcash)*100)/100;patch.pml=p.pml}
  ps.push([p.id,patch])});
 patchParts(ps);render();
 if(!silent)alert('Precios actualizados: '+ps.length+' '+pl(ps.length,'repuesto','repuestos')+'.');
 else if(reason)toast('Precios recalculados automáticamente ('+reason+')');
}
function pr(p,t){if(t==='ml')return p.pml??mlPrice(pr(p,'cash'));return t==='cash'?(p.pcash??p.price):(p.pbcv??p.price)}
function ganTxt(c,a,b){if(!isAdmin()||!(+c>0))return '';const g=v=>money(v-c)+' ('+Math.round((v-c)/c*100)+'%)';return 'Ganancia BCV: '+g(+b||0)+' · CASH: '+g(+a||0)}
function ganPrev(){const bs=document.getElementById('f_bs'),pb=document.getElementById('f_pbcv'),ml=document.getElementById('f_ml'),pm=document.getElementById('f_pml');if(bs&&pb)bs.textContent=bsTxt(pb.value);if(ml&&pm)ml.textContent=mlTxt(pm.value);const e=document.getElementById('f_gan'),c=document.getElementById('f_cost');if(e&&c)e.textContent=ganTxt(c.value,document.getElementById('f_pcash').value,document.getElementById('f_pbcv').value)}
function setTier(v){payTier=v;cart.forEach(c=>{const p=find(c.id);if(p)c.price=pr(p,v)});renderCart()}
function fl(p){return (invF==='all'||(invF==='01'&&p.stock<=1)||(invF==='0'&&p.stock<=0)||(invF==='1'&&p.stock===1))&&(mlFil==='all'||(mlFil==='pub'&&p.mlpub)||(mlFil==='nopub'&&!p.mlpub))}
function setF(k){invF=k;renderInv()}
function setMlF(k){mlFil=k;renderInv()}
function setMlPub(id,on){const p=find(id);if(!p)return;p.mlpub=!!on;patchParts([[id,{mlpub:!!on}]]);saveMedia({id,mlpub:!!on})}
function chips(){
 const c0=db.parts.filter(p=>p.stock<=0).length,c1=db.parts.filter(p=>p.stock===1).length;
 const cp=db.parts.filter(p=>p.mlpub).length,cn=db.parts.length-cp;
 const b=(k,l)=>`<button class="${invF===k?'on':''}" onclick="setF('${k}')">${l}</button>`;
 const m=(k,l)=>`<button class="${mlFil===k?'on':''}" onclick="setMlF('${k}')">${l}</button>`;
 return `<div class="filter-group"><span class="filter-label">Stock</span><div class="seg">${b('all','Todos')}${b('01','0 y 1 ('+(c0+c1)+')')}${b('0','Agotados ('+c0+')')}${b('1','Última ('+c1+')')}</div></div>
 <div class="filter-group"><span class="filter-label">MercadoLibre</span><div class="seg">${m('all','Todos')}${m('pub','Publicados ('+cp+')')}${m('nopub','Sin publicar ('+cn+')')}</div></div>
 ${invF!=='all'?`<button class="btn s ok" onclick="waFilter()">${ico('users')} Enviar por WhatsApp</button>`:''}`;
}
function waFilter(){
 const l=ranked().filter(fl).sort((a,b)=>a.stock-b.stock);
 window.open('https://wa.me/?text='+encodeURIComponent('*GL Multitienda – Repuestos con poco stock*\n'+l.map(p=>'• '+p.name+(p.code?' ('+p.code+')':'')+' – '+(p.stock<=0?'agotado':'queda '+p.stock)).join('\n')),'_blank');
}
function ranked(){
 const t=nz(q).split(/\s+/).filter(Boolean),full=t.join(' ');
 const sc=p=>{if(!t.length)return 0;const n=nz(p.name),c=nz(p.code);
  if(n.startsWith(full)||c.startsWith(t[0]))return 0;
  if(t.every(w=>n.split(/[\s\-\/]+/).some(x=>x.startsWith(w))))return 1;
  return 2};
 return db.parts.filter(match).map(p=>[sc(p),p]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}
function refreshList(){const el=$('#list');if(!el)return;el.innerHTML=view==='inv'?invList():view==='cli'?cliList():sellList();}

function editPart(id){

 $('#box').innerHTML=`<h3 style="margin:0 0 6px;display:flex;align-items:center;gap:8px">${ico(id?'edit':'box')} ${id?'Editar':'Nuevo'} repuesto</h3>
 <label>Foto</label><div class="photo-row"><img class="pv" id="pv" src="${p.img||''}" style="${p.img?'':'display:none'}"><div class="photo-btns"><label class="btn g s">${ico('upload')} ${p.img?'Cambiar foto':'Subir foto'}<input type="file" accept="image/*" hidden onchange="pickImg(this)"></label><button class="btn g s" id="rmImg" style="${p.img?'':'display:none'}" onclick="clearImg()">${ico('trash')} Quitar</button></div></div>

 <div style="display:flex;gap:8px">${isAdmin()?`<div style="flex:1"><label>Costo (lo que te costó)</label><input id="f_cost" type="number" step="0.01" inputmode="decimal" oninput="costChg()" value="${p.cost??''}"></div>`:''}</div>
 <div style="display:flex;gap:8px"><div style="flex:1"><label style="color:#16a34a;font-weight:700">Precio de venta $ BCV</label><input id="f_pbcv" type="number" step="0.01" inputmode="decimal" oninput="bcvIn()" data-man="${id?'1':''}" value="${pr(p,'bcv')}">${pctBtns('f_pbcv')}</div><div style="flex:1"><label style="color:var(--tx);font-weight:700">Precio de venta $ CASH</label><input id="f_pcash" type="number" step="0.01" inputmode="decimal" oninput="this.dataset.man='1';this.dataset.cm='1';ganPrev()" data-man="${id?'1':''}" data-cm="${p.cman?'1':''}" value="${pr(p,'cash')}">${pctBtns('f_pcash')}</div></div>

 <div style="margin-top:10px"><label style="color:#d97706;font-weight:700">Precio MercadoLibre $ (CASH × ${mlFmt(mlF(SET.mode))})</label><input id="f_pml" type="number" step="0.01" inputmode="decimal" oninput="this.dataset.man='1';this.dataset.mm='1';ganPrev()" data-man="${id?'1':''}" data-mm="${p.mman?'1':''}" value="${pr(p,'ml')}"><div id="f_ml" class="mu" style="margin-top:4px">${mlTxt(pr(p,'ml'))}</div></div>
 <div id="f_pct" class="mu" style="margin-top:8px">${pctTxt(p.cost)}</div>

function pickImg(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  window._img=c.toDataURL('image/jpeg',.7);window._imgDirty=true;const pv=$('#pv');pv.src=window._img;pv.style.display='block';const rm=$('#rmImg');if(rm)rm.style.display=''};im.src=r.result};

}
function clearImg(){window._img='';window._imgDirty=true;const pv=$('#pv');if(pv){pv.removeAttribute('src');pv.style.display='none'}const rm=$('#rmImg');if(rm)rm.style.display='none'}
function savePart(id){
 const name=$('#f_name').value.trim();if(!name){alert('Escribe el nombre del repuesto');return}
 const patch={name,code:$('#f_code').value.trim(),brand:$('#f_brand').value.trim(),cost:$('#f_cost')?+$('#f_cost').value||0:(id?find(id).cost||0:0),pcash:+$('#f_pcash').value||0,pbcv:+$('#f_pbcv').value||0,price:+$('#f_pbcv').value||0,base:Math.round((+$('#f_pbcv').value||0)/(1+difPct()/100)*10000)/10000,cman:$('#f_pcash').dataset.cm==='1',pml:+$('#f_pml').value||0,mman:$('#f_pml').dataset.mm==='1',stock:Math.max(0,parseInt($('#f_stock').value)||0),min:1};
 if(!id||window._imgDirty)patch.img=window._img||'';
 let p;if(id){p=find(id);if(!p)return;Object.assign(p,patch)}else{p={id:uid(),ts:Date.now(),...patch};db.parts.unshift(p)}
 if(patchParts([[p.id,patch]])!==false){if(window._imgDirty)saveMedia({id:p.id,img:window._img||'',name:p.name,code:p.code});closeM();render()}
}

async function exportDb(){

 const dl=DL;
 if(!dl){alert('La descarga no está disponible en este momento. Recarga la página e inténtalo de nuevo.');return}

function importDb(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.parts)throw 0;if(confirm('Esto reemplazará los datos actuales. ¿Continuar?')){db=d;db.notes=d.notes||[];db.creditos=d.creditos||[];db.cierres=d.cierres||[];commit(d.parts.map(p=>({ts:0,...p})),db.notes);if(R){db.creditos.forEach(x=>R.doc('creditos/'+x.id).set(JSON.parse(JSON.stringify(x))).catch(se));db.cierres.forEach(c=>R.doc('cierres/'+c.fecha).set(JSON.parse(JSON.stringify(c))).catch(se))}else save();render()}}catch(e){alert('Archivo no válido')}};r.readAsText(f)}

 if(!l.length)return `<div class="empty-state"><div class="empty-ico">${ico('cart')}</div><h3>No hay repuestos para vender</h3><p>${db.parts.length?'Ningún repuesto coincide con la búsqueda.':'Agrega repuestos en el inventario para comenzar a vender.'}</p><button class="btn" onclick="goView('inv')">${ico('box')} Ir al inventario</button></div>`;

  <div class="sell-body"><b>${esc(p.name)}</b><div class="sell-meta">${[esc(p.code),esc(p.brand)].filter(Boolean).join(' · ')||'Sin código'}</div><div class="sell-price">${money(pr(p,payTier))} ${RATE?`<span>· Bs ${bsf(pr(p,payTier)*RATE)}</span>`:''}</div></div>
  <div class="sell-actions"><span class="badge ${p.stock<=0?'danger':p.stock<=1?'warn':'ok'}">${p.stock<=0?'Agotado':p.stock+' '+pl(p.stock,'ud','uds')}</span><button class="btn s" ${p.stock<=0?'disabled':''} onclick="addCart('${p.id}')">${ico('plus')} Agregar</button></div>

function addCart(id){const c=cart.find(x=>x.id===id),p=find(id);if(!p||p.stock<=0)return;if(c){if(c.qty<p.stock)c.qty++}else cart.push({id,qty:1,price:pr(p,payTier)});renderCart();const n=cart.reduce((a,x)=>a+x.qty,0);toast(p.name+' · '+n+' '+pl(n,'artículo','artículos')+' en la venta')}
function quickSell(id){const p=find(id);if(!p||p.stock<=0)return;addCart(id);goView('sell')}
function setPrice(id,v){const c=cart.find(x=>x.id===id);c.price=Math.max(0,parseFloat(v)||0);renderCart()}
function setQty(id,v){const c=cart.find(x=>x.id===id),p=find(id);c.qty=Math.min(p.stock,Math.max(1,parseInt(v)||1));renderCart()}
function rmCart(id){cart=cart.filter(x=>x.id!==id);renderCart()}

function dISO(off){const d=new Date();d.setDate(d.getDate()+(off||0));return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fFec(x){
 if(!x)return '—';
 const m=/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x));
 if(m){const d=new Date(+m[1],+m[2]-1,+m[3]);return d.toLocaleDateString('es')}
 const d=new Date(x);
 return d&&!isNaN(d)?d.toLocaleDateString('es'):'—';
}
function diasVence(v){const d=new Date(String(v||'').slice(0,10)+'T00:00:00');if(isNaN(d))return null;const n=new Date();n.setHours(0,0,0,0);return Math.round((d-n)/864e5)}
function bnum(s){let t=String(s==null?'':s).trim().replace(/[^\d.,-]/g,'');if(!t)return NaN;
 if(t.includes(',')){t=t.replace(/\./g,'').replace(',','.')}
 else{const m=/^(\d+)\.(\d{1,2})$/.exec(t);if(m)t=m[1]+'.'+m[2];else t=t.replace(/\./g,'')}
 return +t}
function comprimeImg(file,maxPx,q){return new Promise(res=>{const rd=new FileReader();rd.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,maxPx/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q||.8))};im.src=rd.result};rd.onerror=()=>res(null);rd.readAsDataURL(file)})}

function blCred(v){BLK.credito=v;const b=$('#b_venceBox');if(b)b.style.display=v==='credito'?'block':'none'}
async function blFoto(inp){const f=inp.files&&inp.files[0];if(!f)return;const d=await comprimeImg(f,1200,.85);if(d){BLK.foto=d;$('#b_prev').innerHTML=`<img src="${d}" style="max-height:160px;border-radius:10px;border:1px solid var(--bd)"> <span class="badge ok">${ico('check')} Foto adjunta</span>`}else alert('No se pudo leer la imagen.')}
function blSplit(line){let f=line.split('\t');if(f.length<2)f=line.split('|');if(f.length<2)f=line.split(';');if(f.length<2)f=line.trim().split(/\s{2,}/);if(f.length<2)f=line.trim().split(/\s+/);return f.map(s=>s.trim()).filter(Boolean)}
function blIsNum(s){return /^\d{1,4}([.,]\d{1,2})?$/.test(String(s||'').trim())}
function blParseLine(line){
  const f=blSplit(line);
  if(f.length<4)return null;
  const cost=bnum(f[f.length-1]);
  if(!(cost>0))return null;
  const code=f[0];
  let brand='',name,qty;
  if(f.length>=5){
    if(blIsNum(f[2])){
      // Formato A: código | marca | cantidad | descripción... | precio
      qty=parseInt(f[2],10);brand=f[1];name=f.slice(3,f.length-1).join(' ');
    }else{
      // Formato B: código | marca | descripción... | cantidad | precio
      qty=parseInt(f[f.length-2],10);brand=f[1];name=f.slice(2,f.length-2).join(' ');
    }
  }else{
    // 4 columnas
    if(blIsNum(f[1])){qty=parseInt(f[1],10);name=f[2]}                       // código | cantidad | descripción | precio
    else if(blIsNum(f[2])){qty=parseInt(f[2],10);name=f[1]}                   // código | descripción | cantidad | precio
    else return null;
  }
  if(!(qty>0)||!name)return null;
  return{code,brand,name,qty,cost};
}
function bulkAnaliza(){
 const txt=$('#b_txt').value||'';
 BLK.prov=$('#b_prov').value.trim();BLK.num=$('#b_num').value.trim();
 const fe=$('#b_fecha'),rc=$('#b_rec'),ve=$('#b_vence');
 if(fe)BLK.fecha=fe.value;if(rc)BLK.recibido=rc.value;if(ve)BLK.vence=ve.value;
 BLK.rows=[];BLK.malas=[];
 txt.split(/\r?\n/).forEach((ln,i)=>{const t=ln.trim();if(!t)return;
  if(i===0&&/c[oó]digo|c[oó]d/i.test(t)&&isNaN(bnum(t)))return;
  const r=blParseLine(t);if(r)BLK.rows.push(r);else BLK.malas.push(t)});
 if(!BLK.rows.length&&!BLK.malas.length){alert('Pega primero el texto de la nota.');return}
 renderBulk();
}

function bulkUnid(){return BLK.rows.reduce((a,r)=>a+r.qty,0)}
function bulkCosto(){return BLK.rows.reduce((a,r)=>a+r.qty*r.cost,0)}

 `<div class="row" style="margin:10px 0 6px"><span class="mu">Todo es editable. Precio de venta (sobre el costo, con diferencial ${pf(difPct())}):</span><button class="btn s" onclick="bulkPriceAll(50)">Todo +50%</button><button class="btn s" onclick="bulkPriceAll(100)">Todo +100%</button></div>

 <div style="overflow-x:auto"><table class="note" style="background:var(--card);color:var(--tx)"><tr><th></th><th>Código</th><th>Marca</th><th>Descripción</th><th class="r">Cant</th><th class="r">Costo</th><th class="r">Total</th><th>Precio de venta</th></tr>
 ${BLK.rows.map((r,i)=>{

  <td class="r" id="bt${i}">${money(r.total)}</td>
  <td><div class="acts" style="margin-top:0"><button class="btn s g" onclick="bulkPrice(${i},50)">+50%</button><button class="btn s g" onclick="bulkPrice(${i},100)">+100%</button></div>
  <div class="mu" id="bp${i}" style="margin-top:3px">${r.pbcv?'BCV '+money(r.pbcv)+' · CASH '+money(r.pcash)+' · ML '+money(r.pml):ex?'<span class="tag">Ya existe</span>':'<span class="tag low">NUEVO</span>'}</div></td></tr>`}).join('')}
 <tr><td colspan="4" class="r"><b>Totales</b></td><td class="r"><b>${bulkUnid()}</b></td><td></td><td class="r"><b>${money(bulkCosto())}</b></td><td></td></tr></table></div>
 ${BLK.malas.length?`<div class="mu" style="margin-top:8px;display:flex;align-items:center;gap:6px">${ico('alert')} ${BLK.malas.length} ${pl(BLK.malas.length,'línea no entendida','líneas no entendidas')} (revisa el formato):</div><div class="mu" style="white-space:pre-wrap;background:var(--bg2);padding:8px;border-radius:8px">${esc(BLK.malas.join('\n'))}</div>`:''}`;

function bulkSet(i,f,v){const r=BLK.rows[i];if(!r)return;if(f==='qty')r.qty=Math.max(1,parseInt(v)||1);else r.cost=Math.max(0,bnum(v)||0);bulkCalc(r);const c=$('#bt'+i);if(c)c.textContent=money(r.total)}
function bulkField(i,f,v){const r=BLK.rows[i];if(r)r[f]=v}
function bulkPrice(i,pct){
 const r=BLK.rows[i];if(!r)return;
 r.pct=pct;
 const base=Math.round((+r.cost||0)*(1+pct/100)*10000)/10000;
 r.pbcv=Math.round(base*(1+difPct()/100)*100)/100;
 r.pcash=cashOf(r.pbcv);
 r.pml=Math.round(mlPrice(r.pcash)*100)/100;
 const e=$('#bp'+i);
 if(e)e.innerHTML='BCV '+money(r.pbcv)+' · CASH '+money(r.pcash)+' · ML '+money(r.pml);
}
function bulkPriceAll(pct){BLK.rows.forEach((r,i)=>bulkPrice(i,pct))}
function bulkRm(i){BLK.rows.splice(i,1);renderBulk()}
function bulkLimpia(){BLK.rows=[];BLK.malas=[];const t=$('#b_txt');if(t)t.value='';const p=$('#b_prev');if(p)p.innerHTML='';const s=$('#b_save');if(s)s.style.display='none'}
function bulkGuarda(){
 if(!BLK.rows.length){alert('No hay filas para guardar.');return}
 const id=uid(),ps=[],patches=[];
 const items=BLK.rows.map(r=>{
  const code=r.code.toUpperCase();
  let p=db.parts.find(x=>(x.code||'').toUpperCase()===code);
  if(p){p.stock+=r.qty;p.cost=r.cost;
   const patch={stock:p.stock,cost:p.cost};
   if(r.pct){const b2=Math.round((+r.cost||0)*(1+r.pct/100)*10000)/10000;p.base=b2;p.pbcv=Math.round(b2*(1+difPct()/100)*100)/100;p.pcash=cashOf(p.pbcv);p.pml=Math.round(mlPrice(p.pcash)*100)/100;p.price=p.pbcv;Object.assign(patch,{base:p.base,pbcv:p.pbcv,pcash:p.pcash,pml:p.pml,price:p.price})}
   const ex=patches.find(x=>x[0]===p.id);
   if(ex)Object.assign(ex[1],patch);else patches.push([p.id,patch])}
  else{
   const pct=r.pct||100;
   const base=Math.round((+r.cost||0)*(1+pct/100)*10000)/10000;
   const pbcv=Math.round(base*(1+difPct()/100)*100)/100;
   const pcash=cashOf(pbcv);
   p={id:uid(),ts:Date.now(),name:r.name,code,brand:r.brand||'',cost:r.cost,base,cman:false,pbcv,price:pbcv,pcash,pml:Math.round(mlPrice(pcash)*100)/100,mman:false,stock:r.qty,min:1,img:''};
   db.parts.unshift(p);if(!ps.includes(p))ps.push(p);
  }
  return{id:p.id,code,brand:r.brand||'',name:r.name,qty:r.qty,cost:r.cost};
 });
 const total=Math.round(items.reduce((a,i)=>a+i.qty*i.cost,0)*100)/100;
 const c={id,ts:Date.now(),prov:BLK.prov||'Sin proveedor',num:BLK.num,fecha:BLK.fecha,recibido:BLK.recibido,credito:BLK.credito,vence:BLK.credito==='credito'?BLK.vence:null,items,total,unidades:bulkUnid(),foto:BLK.foto||null,anulado:false,anuladoDate:null};
 db.compras.unshift(c);
 if(R)R.doc('compras/'+id).set(JSON.parse(JSON.stringify(c))).catch(se);
 patchParts(patches);commit(ps);
 closeM();goView('compras');
 alert('Compra guardada: '+items.length+' '+pl(items.length,'artículo','artículos')+', '+bulkUnid()+' uds, '+money(total)+'.\nEl inventario se actualizó.');
}

 const fe=$('#e_fecha'),rc=$('#e_rec'),cr=$('#e_cred'),vn=$('#e_vence');

 if(rc&&rc.value)c.recibido=rc.value;

 if(R)R.doc('compras/'+id).set(JSON.parse(JSON.stringify(c))).catch(se);else save();
 showCompra(id);renderCompras();
}

  <div class="doc-amount" ${c.anulado?'style="text-decoration:line-through;color:var(--danger)"':''}>${money(c.total||0)}</div></div>`}).join('')}</div>`;

function showCompra(id){

 $('#box').innerHTML=`<h3 style="margin:0;display:flex;align-items:center;gap:8px">${ico('truck')} Nota de compra ${c.num?'N.º '+esc(c.num):''}${c.anulado?' <span style="color:var(--danger);font-size:13px">· Anulada</span>':''}</h3>

 ${(c.items||[]).map(i=>`<tr><td>${esc(i.code||'')}</td><td>${esc(i.name)}</td><td class="r">${i.qty}</td><td class="r">${money(i.cost)}</td></tr>`).join('')}</table></div>
 <div class="row noprint" style="margin-top:14px">

function anularCompra(id,on){
 const c=(db.compras||[]).find(x=>x.id===id);if(!c)return;
 if(on&&!confirm('¿Anular la nota'+(c.num?' N.º '+c.num:'')+'?\n\nQueda marcada como ANULADA, pero sus artículos siguen en el inventario.'))return;
 c.anulado=!!on;c.anuladoDate=on?new Date().toISOString():null;
 if(R)R.doc('compras/'+id).set(JSON.parse(JSON.stringify(c))).catch(se);else save();
 closeM();renderCompras();
 if(!on)alert('Nota reactivada.');
}
function delCompra(id,onlyNote){
 const c=(db.compras||[]).find(x=>x.id===id);if(!c)return;
 if(!confirm(onlyNote?'¿Borrar solo la nota (los artículos quedan en inventario)?':'¿Borrar la nota Y los artículos que creó?'))return;
 if(!onlyNote){const ids=(c.items||[]).map(i=>i.id);db.parts=db.parts.filter(p=>!ids.includes(p.id));if(R)ids.forEach(x=>R.doc('parts/'+x).delete().catch(se))}
 db.compras=db.compras.filter(x=>x.id!==id);
 if(R)R.doc('compras/'+id).delete().catch(se);else save();
 closeM();renderCompras();
}
function purgaAnuladas(){
 if(!confirm('¿Borrar DEFINITIVAMENTE todas las notas anuladas y sus artículos?'))return;
 let n=0;const ids=[],cids=[];
 (db.compras||[]).forEach(c=>{if(c.anulado){cids.push(c.id);ids.push(...(c.items||[]).map(i=>i.id));n++}});
 db.parts=db.parts.filter(p=>!ids.includes(p.id));
 db.compras=(db.compras||[]).filter(c=>!c.anulado);
 if(R){ids.forEach(x=>R.doc('parts/'+x).delete().catch(se));cids.forEach(x=>R.doc('compras/'+x).delete().catch(se))}else save();
 renderCompras();
 alert((n===1?'Borrada 1 nota anulada.':'Borradas '+n+' notas anuladas.'));

/* ---------- GASTOS ---------- */
const GCATS=['Alquiler','Sueldos','Servicios','Transporte','Mercancía','Impuestos','Mantenimiento','Publicidad','Otros'];
function gUsd(g){if(g&&g.usd!=null)return +g.usd||0;const m=+(g&&g.monto)||0;return g&&g.mon==='Bs'?(RATE?m/RATE:m):m}
function gRange(){const n=new Date();if(gP==='ant')return[new Date(n.getFullYear(),n.getMonth()-1,1),new Date(n.getFullYear(),n.getMonth(),1)];if(gP==='todo')return[new Date(2000,0,1),new Date(2100,0,1)];return[new Date(n.getFullYear(),n.getMonth(),1),new Date(n.getFullYear(),n.getMonth()+1,1)]}
function gastosIn(a,b){return(db.gastos||[]).filter(g=>{const d=new Date(String(g.fecha||'')+'T00:00:00');return !isNaN(d)&&d>=a&&d<b})}
function sumGastos(a,b){return gastosIn(a,b).reduce((t,g)=>t+gUsd(g),0)}
function addMes(v,k){const d=new Date(String(v||'')+'T00:00:00');if(isNaN(d))return v;const x=new Date(d.getFullYear(),d.getMonth()+k,d.getDate());return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function gEstado(g){
 if(g.pagado)return `<span class="badge ok">Pagado${g.pago?' · '+fFec(g.pago):''}</span>`;
 if(!g.vence)return '<span class="badge warn">Por pagar</span>';
 const d=diasVence(g.vence);
 if(d==null)return '<span class="badge warn">Por pagar</span>';
 if(d<0)return `<span class="badge danger">Vencido hace ${-d} día${-d===1?'':'s'}</span>`;
 if(d===0)return '<span class="badge warn">Vence hoy</span>';
 if(d<=7)return `<span class="badge warn">Vence en ${d} día${d===1?'':'s'}</span>`;
 return `<span class="badge">Vence ${fFec(g.vence)}</span>`;
}
function renderGastos(){
 const[a,b]=gRange(),all=db.gastos||[],L=gastosIn(a,b).slice().sort((x,y)=>String(y.fecha).localeCompare(String(x.fecha))||((y.ts||0)-(x.ts||0)));
 const tot=L.reduce((t,g)=>t+gUsd(g),0),fij=L.filter(g=>g.tipo==='fijo').reduce((t,g)=>t+gUsd(g),0),varTot=tot-fij;
 const pend=all.filter(g=>!g.pagado),pendTot=pend.reduce((t,g)=>t+gUsd(g),0);
 const venc=pend.filter(g=>{const d=diasVence(g.vence);return d!=null&&d<0}).length;
 const prox=pend.filter(g=>{const d=diasVence(g.vence);return d!=null&&d>=0&&d<=7}).length;
 const per=gP==='mes'?'Este mes':gP==='ant'?'Mes pasado':'Todo el historial';
 const fil=L.filter(g=>gFil==='all'||(gFil==='pagado'?g.pagado:!g.pagado));
 const kpis=`<div class="kpi-grid">
  <div class="kpi ok"><div class="kpi-icon">${ico('wallet')}</div><div class="kpi-label">Gastos del período</div><div class="kpi-value">${money(tot)}</div><div class="kpi-foot"><span>${per}</span><span>·</span><span>${L.length} ${pl(L.length,'gasto','gastos')}</span></div></div>
  <div class="kpi"><div class="kpi-icon">${ico('refresh')}</div><div class="kpi-label">Fijos</div><div class="kpi-value">${money(fij)}</div><div class="kpi-foot"><span>${L.filter(g=>g.tipo==='fijo').length} de ${L.length} registros</span></div></div>
  <div class="kpi purple"><div class="kpi-icon">${ico('receipt')}</div><div class="kpi-label">Variables</div><div class="kpi-value">${money(varTot)}</div><div class="kpi-foot"><span>${L.filter(g=>g.tipo!=='fijo').length} registros</span></div></div>
  <div class="kpi warn"><div class="kpi-icon">${ico('clock')}</div><div class="kpi-label">Por pagar</div><div class="kpi-value">${money(pendTot)}</div><div class="kpi-foot">${venc?`<span class="badge danger">${venc} vencido${venc===1?'':'s'}</span>`:''}${prox?`<span class="badge warn">${prox} por vencer</span>`:''}${!venc&&!prox?'<span class="badge ok">Al día</span>':''}</div></div>
 </div>`;
 const row=g=>`<div class="doc-row" onclick="showGasto('${g.id}')"><div class="doc-ico ${g.pagado?'':'warn'}">${ico('receipt')}</div>
  <div class="doc-main"><div class="doc-title">${esc(g.desc)}</div>
  <div class="doc-meta"><span>${esc(g.cat||'Otros')}</span><span>·</span><span>${g.tipo==='fijo'?'Fijo':'Variable'}</span><span>·</span><span>${fFec(g.fecha)}</span>${g.mon==='Bs'?`<span>·</span><span>Bs ${bsf(g.monto)}</span>`:''}</div>
  <div class="doc-meta" style="margin-top:5px">${gEstado(g)}</div></div>
  <div class="doc-amount">${money(gUsd(g))}</div></div>`;
 const html=fil.length?`<div class="list-card">${fil.map(row).join('')}</div>`:`<div class="empty-state"><div class="empty-ico">${ico('wallet')}</div><h3>Sin gastos ${gFil==='pagado'?'pagados':gFil==='pend'?'pendientes':'en este período'}</h3><p>Registra el alquiler, los sueldos, la luz o cualquier compra que no sea mercancía. Así el reporte te muestra la utilidad real.</p><button class="btn ok" onclick="editGasto()">${ico('plus')} Registrar gasto</button></div>`;
 $('#app').innerHTML=`<div class="page-toolbar"><div class="seg">${[['mes','Este mes'],['ant','Mes pasado'],['todo','Todo']].map(([k,l])=>`<button class="${gP===k?'on':''}" onclick="setGP('${k}')">${l}</button>`).join('')}</div><div class="toolbar-actions"><button class="btn ok" onclick="editGasto()">${ico('plus')} Nuevo gasto</button></div></div>
 ${kpis}
 <div class="page-toolbar"><div class="seg">${[['all','Todos'],['pend','Por pagar'],['pagado','Pagados']].map(([k,l])=>`<button class="${gFil===k?'on':''}" onclick="setGF('${k}')">${l}</button>`).join('')}</div></div>
 ${html}`;
}

 <div style="display:flex;gap:10px;margin-top:10px"><div style="flex:1"><label>Fecha del gasto</label><input id="g_fecha" type="date" value="${d.fecha||dISO(0)}"></div><div style="flex:1"><label>Vence (opcional)</label><input id="g_vence" type="date" value="${d.vence||''}"></div></div>

 <label style="display:flex;align-items:center;gap:9px;margin-top:14px;font-weight:600;font-size:13px"><input type="checkbox" id="g_pag" ${d.pagado?'checked':''}> Ya está pagado</label>

 <div class="row" style="margin-top:16px"><button class="btn ok" onclick="saveGasto()">${ico('check')} Guardar</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`;

/* ---------- CRÉDITOS (CUENTAS POR COBRAR) ---------- */
function fAbonado(f){return (f.abonos||[]).reduce((a,x)=>a+(+x.usd||0),0)}
function fSaldo(f){return Math.max(0,Math.round(((+f.total||0)-fAbonado(f))*100)/100)}
function fPagado(f){return fSaldo(f)<=0.009}
function fVencido(f){return !fPagado(f)&&!!f.vence&&diasVence(f.vence)<0}
function fPendList(){return (db.creditos||[]).filter(f=>!fPagado(f))}
function fCobrar(){return Math.round(fPendList().reduce((t,f)=>t+fSaldo(f),0)*100)/100}
function fClientes(){const m=new Map();fPendList().forEach(f=>{const k=f.ci?nz(f.ci).replace(/[^a-z0-9]/g,''):'n:'+nz(f.cliente);m.set(k,Math.round(((m.get(k)||0)+fSaldo(f))*100)/100)});return m}
function syncCredito(f){if(R)R.doc('creditos/'+f.id).set(JSON.parse(JSON.stringify(f))).catch(se);else save()}
function setFF(v){fFil=v;renderCreditos()}
function fRow(f){
 const s=fSaldo(f),p=fPagado(f),v=fVencido(f);

  const v=Math.round((+(raw||0))*100)/100,e=+(esp[k]||0),df=Math.round((v-e)*100)/100;
  if(has){any=true;te+=e;tt+=v;td+=df}

  if(el){el.textContent=!has||df===0?'—':(df>0?'+':'−')+money(Math.abs(df));el.style.color=!has||df===0?'var(--mu)':df>0?'var(--ok)':'var(--danger)'}});
 const t=$('#cj_tot');
 if(t){
  if(!any){t.textContent='Escribe lo contado en cada método para ver la diferencia.';t.style.color='var(--mu)'}
  else{t.textContent='Contado '+money(tt)+' · Esperado '+money(te)+' · Diferencia '+((td>0?'+':td<0?'−':'')+money(Math.abs(td)));t.style.color=td===0?'var(--mu)':td>0?'var(--ok)':'var(--danger)'}
 }

function clients(){

  const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
  let u=c.toDataURL('image/png');
  if(u.length>180000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.85)}
  LOGO={img:u,w:c.width,h:c.height};
  try{if(R)R.doc('config/logo').set(LOGO).catch(se);else localStorage.setItem('glm_logo',JSON.stringify(LOGO))}catch(e){se(e)}
  render()};im.src=rd.result};
 rd.readAsDataURL(f);
}

function saveBs(no){

function waText(n){

 n.items.forEach(i=>t+=i.qty+' x '+i.name+' – '+money(i.qty*i.price)+'\n');
 t+='\n*Total: '+money(n.total)+'*'+(n.bs>0?'\nTotal Bs: Bs '+bsf(n.bs):'')+(n.pay?'\nPago: '+n.pay:'');

function waNum(v){

 if(!d)return '';
 if(d.startsWith('0'))d=d.slice(1);
 return d.length===10?'58'+d:d;

function voidNote(no){
 const n=db.notes.find(x=>x.no===no);if(!n||n.void)return;
 if((db.creditos||[]).some(f=>f.no===no&&fAbonado(f)>0)){alert('Esta nota tiene abonos registrados en Créditos. Borra esos abonos antes de anularla.');return}
 if(!confirm('¿Anular la nota N.º '+String(no).padStart(5,'0')+'? El stock de sus repuestos volverá al inventario.'))return;
 const ids=[];let miss=0;
 for(const i of n.items){const p=(i.id&&find(i.id))||(i.code&&db.parts.find(x=>x.code===i.code))||db.parts.find(x=>x.name===i.name);
  if(p){p.stock+=i.qty;if(!ids.includes(p.id))ids.push(p.id)}else miss++}
 n.void=true;n.voidDate=new Date().toISOString();
 patchParts(ids.map(id=>[id,{stock:find(id).stock}]));commit([],[n]);
 const fs=(db.creditos||[]).filter(f=>f.no===no);
 if(fs.length){db.creditos=(db.creditos||[]).filter(f=>f.no!==no);fs.forEach(f=>R?R.doc('creditos/'+f.id).delete().catch(se):0);if(!R)save()}
 if(miss)alert(miss+' '+pl(miss,'repuesto ya no existe','repuestos ya no existen')+' en el inventario; no se pudo devolver su stock.');
 showNote(no);render();
}
function delNote(no){
 const n=db.notes.find(x=>x.no===no);if(!n)return;
 const fs=(db.creditos||[]).filter(f=>f.no===no);
 if(!confirm('¿Borrar DEFINITIVAMENTE la nota N.º '+String(no).padStart(5,'0')+'?'+(n.void?'':'\n\nNo está anulada: el stock NO se devuelve al inventario.')+(fs.length?'\n\nTambién se borrará el crédito asociado.':'')))return;
 db.notes=db.notes.filter(x=>x.no!==no);
 if(R)R.doc('notes/'+no).delete().catch(se);else save();
 if(fs.length){db.creditos=(db.creditos||[]).filter(f=>f.no!==no);fs.forEach(f=>R?R.doc('creditos/'+f.id).delete().catch(se):0);if(!R)save()}
 closeM();renderNotes();
}
function purgeVoidNotes(){
 const v=db.notes.filter(n=>n.void);
 if(!v.length){alert('No hay notas anuladas.');return}
 if(!confirm('¿Borrar DEFINITIVAMENTE '+v.length+' '+pl(v.length,'nota anulada','notas anuladas')+'? Esto no se puede deshacer.'))return;
 const nos=v.map(n=>n.no);
 db.notes=db.notes.filter(n=>!n.void);
 if(R)nos.forEach(x=>R.doc('notes/'+x).delete().catch(se));else save();

async function pdfNote(no,share){
 const n=db.notes.find(x=>x.no===no),pad=String(no).padStart(5,'0');

 if(!dl){alert('La descarga no está disponible en este momento. Recarga la página e inténtalo de nuevo.');return}

  if(!window.jspdf){await dl.save({filename:'Nota-'+pad+'.html',data:'<!doctype html><meta charset="utf-8"><title>Nota '+pad+'</title><body style="font-family:sans-serif;max-width:700px;margin:auto">'+$('.note').outerHTML+'</body>'});return}

   waText(n)}
  await dl.save({filename:fn,data:blob});

function themeUI(){

 const u=b.querySelector('use');if(u)u.setAttribute('href',dark?'#i-sun':'#i-moon');

function toggleTheme(){

async function doAuth(){
 const e=lk$('#l_e');e.textContent='';
 const u=lk$('#l_u').value.trim(),p=lk$('#l_p').value;
 if(!u||!p){e.textContent='Escribe tu correo y contraseña.';return}
 if(!window.FB){e.textContent='Conectando… espera un momento y vuelve a intentar.';return}
 try{await FB.login(u,p)}
 catch(x){const c=(x&&x.code)||'';
  e.textContent=/invalid-email/i.test(c)?'Escribe un correo válido.':
   /invalid-credential|wrong-password|user-not-found|invalid-login/i.test(c)?'Correo o contraseña incorrectos.':
   /too-many-requests/i.test(c)?'Demasiados intentos. Espera un minuto y vuelve a intentar.':
   /network/i.test(c)?'Sin conexión. Revisa tu internet y vuelve a intentar.':
   'No se pudo entrar: '+(c||'error')}
}

   return;
  }
  if(e.target.id==='gate')closeGate();
 });
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&root.getElementById('gate').classList.contains('on'))closeGate()});
 const b=root.getElementById('lkBurger'),m=root.getElementById('lkMmenu');
 if(b&&m){
  b.addEventListener('click',()=>{const o=m.classList.toggle('on');b.setAttribute('aria-expanded',o?'true':'false');b.setAttribute('aria-label',o?'Cerrar menú':'Abrir menú')});
 }
 const y=root.getElementById('lkYear');if(y)y.textContent=new Date().getFullYear();
 const rv=root.querySelectorAll('.reveal'),page=root.querySelector('.lk-page');
 if('IntersectionObserver' in window&&!matchMedia('(prefers-reduced-motion: reduce)').matches){
  const io=new IntersectionObserver(es=>{es.forEach(en=>{if(en.isIntersecting){en.target.classList.add('in');io.unobserve(en.target)}})},{root:page,rootMargin:'0px 0px -8% 0px',threshold:.1});
  rv.forEach(el=>io.observe(el));
 }else rv.forEach(el=>el.classList.add('in'));
})();


loadSet();loadRate();fetchRate();setInterval(()=>fetchRate(),30*60*1000);
try{const th=localStorage.getItem('glm_theme')||'auto';if(th==='dark'||th==='light')document.documentElement.dataset.theme=th}catch(e){}
themeUI();
lockUI();window.FB?boot():window.addEventListener('fbready',boot);
function sync(){
 const upd=()=>{cart=cart.filter(c=>find(c.id));const m=$('#modal').classList.contains('on'),a=document.activeElement;if(!m&&!(a&&a.tagName==='INPUT'))render();else refreshList()};
 R.collection('parts').onSnapshot(s=>{
  db.parts=s.docs.map(d=>({ts:0,...d.data()})).sort((a,b)=>b.ts-a.ts);
  $('#st').textContent='☁ Sincronizado';
  if(!mig){mig=true;if(s.empty&&LOC.parts.length&&confirm('Se encontraron '+LOC.parts.length+' repuestos guardados en este dispositivo. ¿Subirlos a la nube para sincronizarlos?'))commit(LOC.parts.map((p,i)=>({ts:Date.now()-i,...p})),LOC.notes)}
  if(!mediaWarned){const md=mediaDiff();if(md.length){mediaWarned=true;toast('Hay fotos o marcas de ML de este equipo que faltan en la nube: Inventario → Respaldo de datos → Restaurar.')}}
  upd()},()=>{$('#st').textContent='Error de sincronización'});
 let unN=null;const cut=new Date(Date.now()-60*864e5).toISOString();
 const watchNotes=()=>{if(unN)unN();unN=R.collection('notes',notesAll?null:['date','>=',cut]).onSnapshot(s=>{
  db.notes=s.docs.map(d=>({...d.data()})).sort((a,b)=>b.no-a.no);
  if(notesAll){window._nAll=true;const mx=Math.max(0,...db.notes.map(x=>x.no));if(mx>SEQ){SEQ=mx;R.doc('config/seq').set({n:SEQ}).catch(se)}}
  upd()},()=>{})};
 window.loadAllNotes=()=>{notesAll=true;watchNotes()};
 R.doc('config/seq').onSnapshot(s=>{if(s.exists){SEQ=Math.max(SEQ,s.data().n||0)}else if(!notesAll){notesAll=true;watchNotes()}},()=>{});
 watchNotes();
 R.collection('compras').onSnapshot(s=>{db.compras=s.docs.map(d=>({...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));upd()},()=>{});
 R.collection('gastos').onSnapshot(s=>{db.gastos=s.docs.map(d=>({...d.data()})).sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||''))||((b.ts||0)-(a.ts||0)));upd()},()=>{});
 R.collection('creditos').onSnapshot(s=>{db.creditos=s.docs.map(d=>({...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));upd()},()=>{});
 R.collection('cierres').onSnapshot(s=>{db.cierres=s.docs.map(d=>({...d.data()})).sort((a,b)=>String(b.fecha||'').localeCompare(String(a.fecha||'')));upd()},()=>{});
 R.doc('config/prices').onSnapshot(s=>{if(s.exists){SET={...SET,...s.data()};parUI();upd()}},()=>{});
 R.doc('config/logo').onSnapshot(s=>{LOGO=s.exists?{...s.data()}:null;upd()},()=>{});
}
</script>

if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
