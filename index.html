<script>
let LOGO=null,CL=[],db={parts:[],notes:[]},R=null,mig=false,view='inv',q='',cart=[],client={name:'',phone:'',ci:''};
let USER=null,synced=false,payMethod='Efectivo',repP='hoy',payTier='bcv',invF='all',notesAll=false,SEQ=0,RATE=0,RATE_MAN=false,RATE_INFO=null,bsMan=null,SET={par:0,difMan:'',disc:20,ml:13,oth:2,mode:'sum'};
const PAYS=['Efectivo','Pago móvil','Transferencia','Punto de venta','Zelle','Otro'];
const ADMINS=[]; // correos con acceso a costos y ganancias (vacío = todos)
const isAdmin=()=>!ADMINS.length||(USER&&ADMINS.includes((USER.email||'').toLowerCase()));
const DL={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data]);const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>'$'+(+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
try{const s=localStorage.getItem('glm_db');if(s){db=JSON.parse(s);db.notes=db.notes||[]}}catch(e){}
const LOC=JSON.parse(JSON.stringify(db));
try{const t=localStorage.getItem('glm_logo');if(t)LOGO=JSON.parse(t)}catch(e){}
const se=e=>alert('No se pudo sincronizar: '+((e&&e.message)||'error'));
function commit(ps=[],ns=[]){if(!R)return save();const c=o=>JSON.parse(JSON.stringify(o));ps.forEach(p=>R.doc('parts/'+p.id).set(c(p)).catch(se));ns.forEach(n=>R.doc('notes/'+n.no).set(c(n)).catch(se));return true}
function save(){if(R)return true;try{localStorage.setItem('glm_db',JSON.stringify(db));return true}catch(e){alert('No se pudo guardar (almacenamiento lleno). Exporta un respaldo y usa fotos más pequeñas.');return false}}
const find=id=>db.parts.find(p=>p.id===id);
const nz=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const match=p=>{const h=nz(p.name+' '+p.code+' '+p.brand);return nz(q).split(/\s+/).filter(Boolean).every(w=>h.includes(w))};
const tag=p=>p.stock<=0?'<span class="tag zero">Agotado</span>':p.stock<=1?`<span class="tag low">Quedan ${p.stock}</span>`:`<span class="tag">${p.stock} en stock</span>`;
const pic=p=>p.img?`<img src="${p.img}" alt="" style="cursor:zoom-in" onclick="zoom('${p.id}')">`:'<div class="ph">⚙️</div>';

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.v;q='';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));render()});

function render(){
 if(view==='inv')renderInv();else if(view==='sell')renderSell();else if(view==='cli')renderCli();else if(view==='rep')renderRep();else renderNotes();
}
function search(ph='Buscar por nombre, código o marca…'){return `<input id="q" type="search" autocomplete="off" placeholder="${ph}" value="${esc(q)}" oninput="q=this.value;refreshList()">`}
function bsf(n){return (+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pctBtns(i){if(!isAdmin())return '';return i==='f_pbcv'?`<div class="acts"><button type="button" class="btn s g" onclick="applyPct(50)">+50%</button><button type="button" class="btn s g" onclick="applyPct(100)">+100%</button></div>`:`<div class="acts"><button type="button" class="btn s g" onclick="cashFromBcv(true)">−${SET.disc}% del BCV</button></div>`}
function pctTxt(c){c=+c;if(!isAdmin()||!(c>0))return '';const d=1+difPct()/100;return '💡 Costo '+money(c)+' → BCV con +100% = <b>'+money(c*2*d)+'</b> · con +50% = <b>'+money(c*1.5*d)+'</b> (incluye diferencial '+pf(difPct())+') · MercadoLibre sobre el CASH con +100% = <b>'+money(mlPrice(cashOf(c*2*d)))+'</b> · con +50% = <b>'+money(mlPrice(cashOf(c*1.5*d)))+'</b>'}
function bsTxt(v){return +v>0?(RATE?'≈ Bs '+bsf(v*RATE)+' al BCV (Bs '+bsf(RATE)+' por $)':'Tasa BCV no disponible'):''}
function cashFromBcv(force){const b=document.getElementById('f_pbcv'),c=document.getElementById('f_pcash');if(!b||!c)return;const v=+b.value||0;if(v>0){if(force){c.dataset.man='';c.dataset.cm=''}if(c.dataset.man!=='1')c.value=cashOf(v)}ganPrev()}
function bcvIn(){const b=document.getElementById('f_pbcv');b.dataset.man='1';cashFromBcv(false)}
function costChg(){
 const c=+document.getElementById('f_cost').value||0,b=document.getElementById('f_pbcv');
 if(c>0&&b&&b.dataset.man!=='1')b.value=Math.round(c*(1+(+(b.dataset.pct||100))/100)*(1+difPct()/100)*100)/100;
 cashFromBcv(false);
 const p=document.getElementById('f_pcash'),m=document.getElementById('f_pml');
 if(c>0&&p&&m&&m.dataset.man!=='1')m.value=Math.round(mlPrice(+p.value||0)*100)/100;
 const t=document.getElementById('f_pct');if(t)t.innerHTML=pctTxt(c);ganPrev();
}
function applyPct(pc){const c=+document.getElementById('f_cost').value||0;if(!(c>0)){alert('Primero escribe el costo');return}const b=document.getElementById('f_pbcv');b.dataset.pct=pc;b.dataset.man='';b.value=Math.round(c*(1+pc/100)*(1+difPct()/100)*100)/100;cashFromBcv(false);const p=document.getElementById('f_pcash'),m=document.getElementById('f_pml');if(m){m.dataset.man='';m.dataset.mm='';m.value=Math.round(mlPrice(+((p&&p.value)||0))*100)/100}ganPrev()}
function loadRate(){try{const t=JSON.parse(localStorage.getItem('glm_rate')||'null');if(t&&t.rate>0){RATE=t.rate;RATE_INFO=t.info||null;RATE_MAN=!!t.man&&!!t.info&&t.info.manDate===new Date().toISOString().slice(0,10)}}catch(e){}rateUI()}
function saveRate(){try{localStorage.setItem('glm_rate',JSON.stringify({rate:RATE,man:RATE_MAN,info:RATE_INFO}))}catch(e){}}
function rateInfoTxt(){return RATE_MAN?'Tasa manual de hoy. Toca "Actualizar" para volver a la automática.':RATE_INFO&&RATE_INFO.src?'Automática · Fuente: '+RATE_INFO.src+' · Fecha valor: '+(RATE_INFO.fecha||'—'):'No se pudo traer la tasa automática. Escríbela a mano.'}
function rateUI(){
 parUI();
 const b=document.getElementById('rateBtn');if(b)b.textContent=RATE?'🧮 Bs '+bsf(RATE):'🧮 Tasa';
 const i=document.getElementById('c_info');if(i)i.textContent=rateInfoTxt();
 if(!document.getElementById('modal').classList.contains('on')&&document.getElementById('list'))refreshList();
}
async function fetchRate(force){
 if(RATE_MAN&&!force)return false;
 const srcs=[
  ['https://api-dolar.leandrus.net/v1/dolares/oficial/siguiente','json'],
  ['https://api-dolar.leandrus.net/v1/dolares/oficial','json'],
  ['https://ve.dolarapi.com/v1/dolares/oficial','json'],
  ['https://api.allorigins.win/raw?url='+encodeURIComponent('https://www.bcv.org.ve/'),'bcv']];
 for(const [u,k] of srcs){
  try{
   const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),8000);
   const res=await fetch(u,{signal:ctl.signal});clearTimeout(t);if(!res.ok)continue;
   let v=0,fecha='';
   if(k==='json'){const j=await res.json();v=+(j.promedio??j.venta);fecha=String(j.fechaActualizacion||'').slice(0,10)}
   else{const m=(await res.text()).match(/id="dolar"[\s\S]*?<strong>\s*([\d.,]+)\s*<\/strong>/);if(m)v=+m[1].replace(/\./g,'').replace(',','.')}
   if(v>1&&v<1e6){RATE=v;RATE_MAN=false;RATE_INFO={fecha,src:k==='bcv'?'bcv.org.ve (vía proxy)':new URL(u).hostname+(u.endsWith('/siguiente')?' (próxima fecha valor)':'')};saveRate();rateUI();return true}
  }catch(e){}
 }
 rateUI();return false;
}
function rateIn(){const v=+document.getElementById('c_rate').value;if(!(v>0))return;RATE=v;RATE_MAN=true;RATE_INFO={manDate:new Date().toISOString().slice(0,10)};saveRate();rateUI();calcFrom('usd')}
function calcFrom(k){const u=document.getElementById('c_usd'),b=document.getElementById('c_bs');if(!RATE)return;if(k==='usd'){const v=+u.value;b.value=v?Math.round(v*RATE*100)/100:''}else{const v=+b.value;u.value=v?Math.round(v/RATE*100)/100:''}}
function openCalc(){
 $('#box').innerHTML=`<h3 style="margin:0">🧮 Calculadora BCV</h3><div class="mu" id="c_info">${esc(rateInfoTxt())}</div><div class="mu"><a href="https://www.bcv.org.ve/" target="_blank" rel="noopener">Comparar con bcv.org.ve</a></div>
 <label>Tasa BCV (Bs por $)</label><div class="row" style="margin:0"><input id="c_rate" type="number" step="0.0001" inputmode="decimal" value="${RATE||''}" oninput="rateIn()"><button class="btn s g" onclick="fetchRate(true).then(openCalc)">Actualizar</button></div>
 <label>Monto en $ (por ejemplo, el costo del repuesto)</label><input id="c_usd" type="number" step="0.01" inputmode="decimal" oninput="calcFrom('usd')">
 <label>Resultado en Bs</label><input id="c_bs" type="number" step="0.01" inputmode="decimal" oninput="calcFrom('bs')">
 <div class="row" style="margin-top:12px"><button class="btn g" onclick="closeM()">Cerrar</button></div>`;
 $('#modal').classList.add('on');
}
function pf(n){return (+n||0).toLocaleString('de-DE',{maximumFractionDigits:2})+'%'}
function autoDif(){return RATE&&+SET.par>RATE?(SET.par/RATE-1)*100:0}
function difPct(){return SET.difMan!==''&&SET.difMan!=null&&!isNaN(+SET.difMan)?+SET.difMan:autoDif()}
function cashOf(bcv){return Math.round((+bcv||0)*(1-(+SET.disc||0)/100)*100)/100}
function mlF(mode){const a=(+SET.ml||0)/100,b=(+SET.oth||0)/100;return mode==='net'?1/((1-a)*(1-b)):(1+a)*(1+b)}
function mlPrice(cash){return cash*mlF(SET.mode)}
function mlFmt(n){return n.toLocaleString('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4})}
function mlTxt(v){v=+v;return v>0?(RATE?'≈ Bs '+bsf(v*RATE)+' al BCV · ':'')+'CASH '+mlFmt(mlF(SET.mode))+' (× '+pf(SET.ml)+' y luego × '+pf(SET.oth)+')':''}
function parUI(){const b=document.getElementById('parBtn');if(b)b.textContent=SET.par>0||SET.difMan!==''?'📈 Paralelo '+(SET.par>0?bsf(SET.par):'')+' (+'+pf(difPct())+')':'📈 Paralelo: definir'}
function loadSet(){try{const t=JSON.parse(localStorage.getItem('glm_set')||'null');if(t)SET={...SET,...t}}catch(e){}parUI()}
function storeSet(){try{localStorage.setItem('glm_set',JSON.stringify(SET))}catch(e){}if(R)R.doc('config/prices').set(JSON.parse(JSON.stringify(SET))).catch(se)}
function openSet(){
 $('#box').innerHTML=`<h3 style="margin:0">📈 Precios y tasas</h3>
 <div class="mu">Diferencial automático: <b>${pf(autoDif())}</b> (tasa paralela ÷ tasa BCV${RATE?' '+bsf(RATE):''}). El precio BCV de venta ya incluye este diferencial.</div>
 <label>Tasa paralela (Bs por $)</label><input id="s_par" type="number" step="0.01" inputmode="decimal" value="${SET.par||''}">
 <label>Diferencial % manual (vacío = automático)</label><input id="s_dif" type="number" step="0.01" inputmode="decimal" value="${SET.difMan}">
 <label>Descuento del precio CASH respecto al BCV (%)</label><input id="s_disc" type="number" step="0.01" inputmode="decimal" value="${SET.disc}">
 <div style="display:flex;gap:8px"><div style="flex:1"><label>MercadoLibre comisión %</label><input id="s_ml" type="number" step="0.01" inputmode="decimal" value="${SET.ml}"></div><div style="flex:1"><label>Mercasist %</label><input id="s_oth" type="number" step="0.01" inputmode="decimal" value="${SET.oth}"></div></div>
 <div class="mu">El precio de MercadoLibre sale del <b>precio CASH</b>: primero se suma el ${pf(SET.ml)} de MercadoLibre y <b>sobre ese resultado</b> se suma el ${pf(SET.oth)} de Mercasist. No es lo mismo que sumar ${pf((+SET.ml||0)+(+SET.oth||0))} de una sola vez. No incluye el diferencial paralelo.</div>
 <label>Cómo aplicar las comisiones de MercadoLibre</label><select id="s_mode"><option value="sum" ${SET.mode==='sum'?'selected':''}>Sumar en cascada: CASH × ${mlFmt(mlF('sum'))}</option><option value="net" ${SET.mode==='net'?'selected':''}>Compensar y recibir el CASH completo: CASH ÷ ${mlFmt(1/mlF('net'))}</option></select>
 <div class="row" style="margin-top:14px"><button class="btn" onclick="saveSet()">Guardar</button><button class="btn g" onclick="closeM()">Cancelar</button></div>
 <div class="row"><button class="btn g s" onclick="recalcAsk()">Recalcular los precios de todos los repuestos</button></div>`;
 $('#modal').classList.add('on');
}
function saveSet(){
 const old=difPct(),g=i=>document.getElementById(i).value;
 SET={par:+g('s_par')||0,difMan:g('s_dif')===''?'':+g('s_dif'),disc:+g('s_disc')||0,ml:+g('s_ml')||0,oth:+g('s_oth')||0,mode:g('s_mode')};
 storeSet();parUI();closeM();
 if(db.parts.length&&Math.abs(difPct()-old)>0.005)recalcAsk(old);else render();
}
function recalcAsk(old){
 const n=db.parts.length;if(!n){alert('No hay repuestos.');return}
 const dp=difPct();
 if(dp>100&&!confirm('Ojo: el diferencial ha quedado en '+pf(dp)+'. Puede ser real o puede que la tasa paralela esté mal escrita.\n\nSi la tasa paralela está mal, al dejar vacío el diferencial manual el precio BCV se multiplicaría por un número enorme.\n\n¿Recalcular de todos modos?')){render();return}
 if(confirm('¿Recalcular los precios BCV, CASH y MercadoLibre de '+n+' repuestos con el diferencial actual ('+pf(dp)+')?'+(old!=null?' Antes era '+pf(old)+'.':'')+'\nLos precios CASH y MercadoLibre que fijaste a mano no se tocan.'))recalcAll();else render();
}
function recalcAll(){
 const d=1+difPct()/100,ps=[];
 db.parts.forEach(p=>{const base=p.base??pr(p,'bcv'),nb=Math.round(base*d*100)/100;p.base=base;p.pbcv=nb;p.price=nb;if(!p.cman)p.pcash=cashOf(nb);if(!p.mman)p.pml=Math.round(mlPrice(p.pcash)*100)/100;ps.push(p)});
 commit(ps);render();alert('Precios actualizados: '+ps.length+' repuestos.');
}
function pr(p,t){if(t==='ml')return p.pml??mlPrice(pr(p,'cash'));return t==='cash'?(p.pcash??p.price):(p.pbcv??p.price)}
function ganTxt(c,a,b){if(!isAdmin()||!(+c>0))return '';const g=v=>money(v-c)+' ('+Math.round((v-c)/c*100)+'%)';return 'Ganancia BCV: '+g(+b||0)+' · CASH: '+g(+a||0)}
function ganPrev(){const bs=document.getElementById('f_bs'),pb=document.getElementById('f_pbcv'),ml=document.getElementById('f_ml'),pm=document.getElementById('f_pml');if(bs&&pb)bs.textContent=bsTxt(pb.value);if(ml&&pm)ml.textContent=mlTxt(pm.value);const e=document.getElementById('f_gan'),c=document.getElementById('f_cost');if(e&&c)e.textContent=ganTxt(c.value,document.getElementById('f_pcash').value,document.getElementById('f_pbcv').value)}
function setTier(v){payTier=v;cart.forEach(c=>{const p=find(c.id);if(p)c.price=pr(p,v)});renderCart()}
function fl(p){return invF==='all'||(invF==='01'&&p.stock<=1)||(invF==='0'&&p.stock<=0)||(invF==='1'&&p.stock===1)}
function setF(k){invF=k;renderInv()}
function chips(){
 const c0=db.parts.filter(p=>p.stock<=0).length,c1=db.parts.filter(p=>p.stock===1).length;
 const b=(k,l)=>`<button class="btn s ${invF===k?'':'g'}" onclick="setF('${k}')">${l}</button>`;
 return `<div class="row">${b('all','Todos')}${b('01','En 0 y 1 ('+(c0+c1)+')')}${b('0','Solo 0 ('+c0+')')}${b('1','Solo 1 ('+c1+')')}${invF!=='all'?'<button class="btn s" style="background:#16a34a" onclick="waFilter()">WhatsApp</button>':''}</div>`;
}
function waFilter(){
 const l=ranked().filter(fl).sort((a,b)=>a.stock-b.stock);
 window.open('https://wa.me/?text='+encodeURIComponent('*GL Multitienda – Repuestos con poco stock*\n'+l.map(p=>'• '+p.name+(p.code?' ('+p.code+')':'')+' – '+(p.stock<=0?'agotado':'queda '+p.stock)).join('\n')),'_blank');
}
function ranked(){
 const t=nz(q).split(/\s+/).filter(Boolean),full=t.join(' ');
 const sc=p=>{if(!t.length)return 0;const n=nz(p.name),c=nz(p.code);
  if(n.startsWith(full)||c.startsWith(t[0]))return 0;
  if(t.every(w=>n.split(/[\s\-\/]+/).some(x=>x.startsWith(w))))return 1;
  return 2};
 return db.parts.filter(match).map(p=>[sc(p),p]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
}

function pickImg(inp){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{const im=new Image();im.onload=()=>{const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  window._img=c.toDataURL('image/jpeg',.7);const pv=$('#pv');pv.src=window._img;pv.style.visibility='visible'};im.src=r.result};
 r.readAsDataURL(f);
}

 const name=$('#f_name').value.trim();if(!name){alert('Escribe el nombre del repuesto');return}

 let p;if(id){p=find(id);Object.assign(p,d)}else{p={id:uid(),ts:Date.now(),...d};db.parts.unshift(p)}

async function exportDb(){
 if(!notesAll&&window.loadAllNotes){window.loadAllNotes();for(let i=0;i<25&&!window._nAll;i++)await new Promise(r=>setTimeout(r,300))}
 const dl=DL;
 if(!dl){alert('La descarga no está disponible en este momento. Recarga la página e inténtalo de nuevo.');return}

function addCart(id){const c=cart.find(x=>x.id===id),p=find(id);if(c){if(c.qty<p.stock)c.qty++}else cart.push({id,qty:1,price:pr(p,payTier)});renderCart()}

function setQty(id,v){const c=cart.find(x=>x.id===id),p=find(id);c.qty=Math.min(p.stock,Math.max(1,parseInt(v)||1));renderCart()}

function checkout(){
 for(const c of cart){const p=find(c.id);if(c.qty>p.stock){alert(`Stock insuficiente de ${p.name}`);return}}

 db.notes.unshift(n);SEQ=n.no;if(R)R.doc('config/seq').set({n:SEQ}).catch(se);if(!commit(cart.map(c=>find(c.id)),[n]))return;

}

 <div style="overflow-x:auto"><table><tr><th>Cant.</th><th>Descripción</th><th class="r">P. unit.</th><th class="r">Importe</th></tr>
 ${n.items.map(i=>`<tr><td>${i.qty}</td><td>${esc(i.name)}<br><small>${esc(i.code)}</small></td><td class="r">${money(i.price)}</td><td class="r">${money(i.qty*i.price)}</td></tr>`).join('')}
 <tr><td colspan="3" class="r"><b>TOTAL</b></td><td class="r"><b>${money(n.total)}</b></td></tr>${n.bs>0?`<tr><td colspan="3" class="r"><b>TOTAL Bs</b></td><td class="r"><b>Bs ${bsf(n.bs)}</b></td></tr>`:''}</table></div>
 <div class="sig"><div>Entregado por</div><div>Recibido por</div></div></div>
 <div class="row noprint" style="margin-top:12px"><button class="btn" onclick="pdfNote(${n.no})">⬇ Descargar PDF</button><button class="btn" style="background:#16a34a" onclick="pdfNote(${n.no},true)">WhatsApp</button><button class="btn g" onclick="window.print()">🖨 Imprimir</button>${n.void?'':`<button class="btn g" onclick="editBs(${n.no})">Cambiar Bs</button><button class="btn g" style="color:var(--danger)" onclick="voidNote(${n.no})">Anular nota</button>`}<button class="btn g" onclick="closeM()">Cerrar</button></div>`;
 $('#modal').classList.add('on');
}
function clients(){
 const m=new Map();
 for(const n of db.notes){
  if(n.void)continue;
  if(!n.ci&&(!n.client||n.client==='Cliente general'))continue;
  const k=n.ci?nz(n.ci).replace(/[^a-z0-9]/g,''):'n:'+nz(n.client);
  let c=m.get(k);
  if(!c){c={k,name:n.client,ci:n.ci||'',phone:n.phone||'',n:0,total:0,last:n.date,notes:[]};m.set(k,c)}
  c.n++;c.total+=n.total;c.notes.push(n.no);if(!c.phone&&n.phone)c.phone=n.phone;
 }
 return [...m.values()];
}
function autoFill(by){
 const v=by==='ci'?nz(client.ci).replace(/[^a-z0-9]/g,''):nz(client.name);if(!v)return;
 const c=CL.find(x=>by==='ci'?x.k===v:nz(x.name)===v);if(!c)return;
 if(by==='ci'){client.name=c.name;$('#c_nm').value=c.name}else if(!client.ci){client.ci=c.ci;$('#c_ci').value=c.ci}
 if(!client.phone&&c.phone){client.phone=c.phone;$('#c_ph').value=c.phone}
}
function renderCli(){$('#app').innerHTML=moreNotes()+search('Buscar cliente por nombre, cédula o teléfono…')+'<div id="list" style="margin-top:10px">'+cliList()+'</div>'}
function cliList(){
 CL=clients();
 const l=CL.map((c,i)=>({c,i})).filter(({c})=>{const h=nz(c.name+' '+c.ci+' '+c.phone);return nz(q).split(/\s+/).filter(Boolean).every(w=>h.includes(w))});
 if(!l.length)return '<div class="empty">'+(CL.length?'Sin resultados.':'Aún no hay clientes. Se guardan automáticamente al generar notas con nombre o cédula.')+'</div>';
 return '<div class="grid">'+l.map(({c,i})=>`<div class="card"><div class="ph">👤</div><div class="i"><b>${esc(c.name)}</b><div class="mu">${c.ci?'C.I. '+esc(c.ci):'Sin cédula'}${c.phone?' · '+esc(c.phone):''}</div>
 <div class="mu">${c.n} compra${c.n>1?'s':''} · ${money(c.total)} · Última: ${new Date(c.last).toLocaleDateString('es')}</div>
 <div class="acts"><button class="btn s g" onclick="showClient(${i})">Ver compras</button><button class="btn s" onclick="sellTo(${i})">Vender</button></div></div></div>`).join('')+'</div>';
}
function showClient(i){
 const c=CL[i];if(!c)return;
 $('#box').innerHTML=`<h3 style="margin:0">${esc(c.name)}</h3><div class="mu">${c.ci?'C.I. '+esc(c.ci):''} ${c.phone?'· '+esc(c.phone):''}</div>
 <div style="margin:10px 0"><b>${c.n}</b> compras · Total <b>${money(c.total)}</b></div>
 ${db.notes.filter(n=>c.notes.includes(n.no)).map(n=>`<div class="ci" style="cursor:pointer" onclick="showNote(${n.no})"><div class="n"><b>Nota N.º ${String(n.no).padStart(5,'0')}</b><div class="mu">${new Date(n.date).toLocaleString('es')}</div></div><b>${money(n.total)}</b></div>`).join('')}
 <div class="row" style="margin-top:12px"><button class="btn g" onclick="closeM()">Cerrar</button></div>`;
 $('#modal').classList.add('on');
}
function sellTo(i){const c=CL[i];if(!c)return;client={name:c.name,phone:c.phone,ci:c.ci};view='sell';q='';document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x.dataset.v==='sell'));render()}
function setLogo(inp){
 const f=inp.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{const im=new Image();im.onload=()=>{
  const k=Math.min(1,300/Math.max(im.width,im.height)),c=document.createElement('canvas');
  c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
  const x=c.getContext('2d');x.drawImage(im,0,0,c.width,c.height);
  let u=c.toDataURL('image/png');
  if(u.length>180000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);u=c.toDataURL('image/jpeg',.85)}
  LOGO={img:u,w:c.width,h:c.height};
  try{if(R)R.doc('config/logo').set(LOGO).catch(se);else localStorage.setItem('glm_logo',JSON.stringify(LOGO))}catch(e){se(e)}
  render()};im.src=rd.result};
 rd.readAsDataURL(f);
}
function delLogo(){if(!confirm('¿Quitar el logo?'))return;LOGO=null;try{if(R)R.doc('config/logo').delete().catch(se);else localStorage.removeItem('glm_logo')}catch(e){}render()}
function bsNow(){const t=total();if(bsMan&&bsMan.for===t)return +bsMan.v||0;return RATE?Math.round(t*RATE*100)/100:0}
function bsVal(){const t=total();if(bsMan&&bsMan.for!==t)bsMan=null;return bsMan?bsMan.v:(RATE?Math.round(t*RATE*100)/100:'')}
function bsIn(v){bsMan={v:v===''?'':+v,for:total()}}
function bsAuto(){bsMan=null;renderCart()}
function bsBox(){return RATE?`<label class="mu" style="display:block;margin-top:-4px">Total cobrado en Bs (tasa ${bsf(RATE)}) · <a href="#" onclick="bsAuto();return false">automático</a></label><input type="number" step="0.01" inputmode="decimal" value="${bsVal()}" oninput="bsIn(this.value)" placeholder="Vacío = no mostrar Bs en la nota">`:'<div class="mu">Tasa BCV no disponible: toca 🧮 arriba para escribirla.</div>'}
function editBs(no){
 const n=db.notes.find(x=>x.no===no);if(!n)return;
 $('#box').innerHTML=`<h3 style="margin:0">Total en Bs · Nota N.º ${String(no).padStart(5,'0')}</h3><div class="mu">Total ${money(n.total)}${n.rate?' · tasa '+bsf(n.rate):''}</div><label>Cobrado en Bs (vacío = no mostrar Bs en la nota)</label><input id="bs_e" type="number" step="0.01" inputmode="decimal" value="${n.bs||''}"><div class="row" style="margin-top:14px"><button class="btn" onclick="saveBs(${no})">Guardar</button><button class="btn g" onclick="closeM()">Cancelar</button></div>`;
 $('#modal').classList.add('on');
}
function saveBs(no){
 const n=db.notes.find(x=>x.no===no);if(!n)return;
 let v=(($('#bs_e')||{}).value||'').trim().replace(/\s/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');
 const x=+v;n.bs=v===''||isNaN(x)?0:Math.round(x*100)/100;if(!n.rate&&RATE)n.rate=RATE;
 commit([],[n]);showNote(no);
}
function waText(n){
 const pad=String(n.no).padStart(5,'0');
 let t='*GL Multitienda*\nNota de entrega N.º '+pad+'\nFecha: '+new Date(n.date).toLocaleDateString('es')+'\nCliente: '+n.client+(n.ci?' (C.I. '+n.ci+')':'')+'\n\n';
 n.items.forEach(i=>t+=i.qty+' x '+i.name+' – '+money(i.qty*i.price)+'\n');
 t+='\n*Total: '+money(n.total)+'*'+(n.bs>0?'\nTotal Bs: Bs '+bsf(n.bs):'')+(n.pay?'\nPago: '+n.pay:'');
 const ph=waNum(n.phone);
 window.open('https://wa.me/'+(ph?ph+'?text=':'?text=')+encodeURIComponent(t),'_blank');
}
function waNum(v){
 let d=String(v||'').replace(/\D/g,'');
 if(!d)return '';
 if(d.startsWith('0'))d=d.slice(1);
 return d.length===10?'58'+d:d;
}
function voidNote(no){
 const n=db.notes.find(x=>x.no===no);if(!n||n.void)return;
 if(!confirm('¿Anular la nota N.º '+String(no).padStart(5,'0')+'? El stock de sus repuestos volverá al inventario.'))return;
 const ps=[];let miss=0;
 for(const i of n.items){const p=(i.id&&find(i.id))||(i.code&&db.parts.find(x=>x.code===i.code))||db.parts.find(x=>x.name===i.name);
  if(p){p.stock+=i.qty;if(!ps.includes(p))ps.push(p)}else miss++}
 n.void=true;n.voidDate=new Date().toISOString();
 commit(ps,[n]);
 if(miss)alert(miss+' repuesto(s) ya no existen en el inventario; no se pudo devolver su stock.');
 showNote(no);render();
}
function setRep(k){repP=k;renderRep()}
function repFrom(){const d=new Date(),s=new Date(d.getFullYear(),d.getMonth(),d.getDate());if(repP==='semana')s.setDate(s.getDate()-6);else if(repP==='mes')s.setDate(1);else if(repP==='todo')return new Date(0);return s}
function lowParts(){return db.parts.filter(p=>p.stock<=1).sort((a,b)=>a.stock-b.stock)}
function restockText(){return '*GL Multitienda – Repuestos por reponer*\n'+lowParts().map(p=>'• '+p.name+(p.code?' ('+p.code+')':'')+' – quedan '+p.stock).join('\n')}
function waRestock(){window.open('https://wa.me/?text='+encodeURIComponent(restockText()),'_blank')}
async function copyRestock(){try{await navigator.clipboard.writeText(restockText());alert('Lista copiada')}catch(e){alert('No se pudo copiar')}}
function renderRep(){
 const from=repFrom(),ns=db.notes.filter(n=>!n.void&&new Date(n.date)>=from),adm=isAdmin();
 let tot=0,gan=0;const pay={},top={};
 ns.forEach(n=>{tot+=n.total;const k=n.pay||'Sin especificar';pay[k]=(pay[k]||0)+n.total;
  n.items.forEach(i=>{if(i.cost!=null)gan+=i.qty*(i.price-i.cost);const t=top[i.name]=top[i.name]||{q:0,m:0};t.q+=i.qty;t.m+=i.qty*i.price})});
 const tl=Object.entries(top).sort((a,b)=>b[1].q-a[1].q).slice(0,10),low=lowParts();
 const st=(l,v)=>`<div class="panel" style="margin:0"><div class="mu">${l}</div><div style="font-size:20px;font-weight:700">${v}</div></div>`;
 const li=(a,b)=>`<div class="ci"><div class="n">${a}</div><b>${b}</b></div>`;
 $('#app').innerHTML=`${repP==='todo'?moreNotes():''}<div class="row">${[['hoy','Hoy'],['semana','7 días'],['mes','Este mes'],['todo','Todo']].map(([k,l])=>`<button class="btn s ${repP===k?'':'g'}" onclick="setRep('${k}')">${l}</button>`).join('')}</div>
 <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px">${st('Vendido',money(tot))}${adm?st('Ganancia',money(gan)):''}${st('Notas',ns.length)}</div>
 <div class="panel"><b>Por forma de pago</b>${Object.keys(pay).length?Object.entries(pay).map(([k,v])=>li(esc(k),money(v))).join(''):'<div class="mu">Sin ventas en este período</div>'}</div>
 <div class="panel"><b>Más vendidos</b>${tl.length?tl.map(([k,v])=>li(esc(k)+'<div class="mu">'+money(v.m)+'</div>',v.q+' uds')).join(''):'<div class="mu">Sin ventas en este período</div>'}</div>
 <div class="panel"><b>Por reponer (${low.length})</b>${low.length?low.map(p=>li(esc(p.name)+'<div class="mu">'+esc(p.code)+'</div>',p.stock<=0?'Agotado':p.stock+' uds')).join('')+'<div class="row" style="margin-top:10px"><button class="btn" style="background:#16a34a" onclick="waRestock()">Enviar por WhatsApp</button><button class="btn g" onclick="copyRestock()">Copiar lista</button></div>':'<div class="mu">Ningún repuesto tiene 1 unidad o menos.</div>'}</div>`;
}
async function pdfNote(no,share){
 const n=db.notes.find(x=>x.no===no),pad=String(no).padStart(5,'0');
 const dl=DL;
 if(!dl){alert('La descarga no está disponible en este momento. Recarga la página e inténtalo de nuevo.');return}
 try{
  if(!window.jspdf){await dl.save({filename:'Nota-'+pad+'.html',data:'<!doctype html><meta charset="utf-8"><title>Nota '+pad+'</title><body style="font-family:sans-serif;max-width:700px;margin:auto">'+$('.note').outerHTML+'</body>'});return}
  const d=new window.jspdf.jsPDF({unit:'mm',format:'letter'}),L=15,R2=200;let y=20;
  const t=(x,s,o)=>d.text(String(s),x,y,o),f=b=>d.setFont('helvetica',b?'bold':'normal');
  if(LOGO){let h=22,w=h*LOGO.w/LOGO.h;if(w>60){w=60;h=w*LOGO.h/LOGO.w}d.addImage(LOGO.img,LOGO.img.startsWith('data:image/png')?'PNG':'JPEG',R2-w,12,w,h)}
  f(1);d.setFontSize(20);t(L,'GL Multitienda');y+=6;f();d.setFontSize(10);t(L,'Repuestos automotrices');
  y+=11;f(1);d.setFontSize(13);t(L,'NOTA DE ENTREGA N.º '+pad);
  y+=7;f();d.setFontSize(10);t(L,'Fecha: '+new Date(n.date).toLocaleString('es'));
  y+=5;t(L,'Cliente: '+n.client);
  if(n.ci){y+=5;t(L,'Cédula: '+n.ci)}
  if(n.phone){y+=5;t(L,'Teléfono: '+n.phone)}
  if(n.pay){y+=5;t(L,'Forma de pago: '+n.pay+(n.tier?' · Precio '+(n.tier==='bcv'?'$ BCV':'$ CASH'):''))}
  if(n.void){y+=6;f(1);d.setTextColor(200,0,0);t(L,'*** NOTA ANULADA ***');d.setTextColor(0,0,0);f()}
  y+=8;f(1);t(L,'Cant.');t(30,'Descripción');t(165,'P. unit.',{align:'right'});t(R2,'Importe',{align:'right'});
  y+=2;d.line(L,y,R2,y);f();
  for(const i of n.items){
   const ls=d.splitTextToSize(i.name+(i.code?' ('+i.code+')':''),115);
   if(y+ls.length*5+8>255){d.addPage();y=20}
   y+=6;t(L,i.qty);d.text(ls,30,y);t(165,money(i.price),{align:'right'});t(R2,money(i.qty*i.price),{align:'right'});
   y+=(ls.length-1)*5+2;d.setDrawColor(200);d.line(L,y,R2,y);
  }
  y+=8;f(1);d.setFontSize(12);t(165,'TOTAL',{align:'right'});t(R2,money(n.total),{align:'right'});
  if(n.bs>0){y+=6;t(165,'TOTAL Bs',{align:'right'});t(R2,'Bs '+bsf(n.bs),{align:'right'});}
  if(y>230){d.addPage();y=20}
  y+=35;d.setDrawColor(0);d.line(L,y,80,y);d.line(120,y,R2,y);y+=5;f();d.setFontSize(10);t(47,'Entregado por',{align:'center'});t(160,'Recibido por',{align:'center'});
  const blob=d.output('blob'),fn='Nota-de-entrega-'+pad+'.pdf';
  if(share){const f=new File([blob],fn,{type:'application/pdf'});
   if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Nota de entrega '+pad});return}catch(e){if(e&&e.name==='AbortError')return}}
   waText(n)}
  await dl.save({filename:fn,data:blob});
 }catch(e){if(!e||e.code!=='declined')alert('No se pudo descargar: '+((e&&e.message)||'error'))}
}
render();

function lockUI(msg){
 $('#lbox').innerHTML=`<h2 style="margin:0 0 4px">🔧 GL Multitienda</h2><div class="mu">Inicia sesión para continuar</div>
 <label>Correo</label><input id="l_u" type="email" autocomplete="username" autocapitalize="none">
 <label>Contraseña</label><input id="l_p" type="password" autocomplete="current-password">
 <div id="l_e" style="color:var(--danger);min-height:20px;margin:8px 0">${msg||''}</div><button class="btn" style="width:100%" onclick="doAuth()">Entrar</button>
  <div style="text-align:center;margin-top:14px"><a href="#" onclick="viewRecupera();return false" style="color:var(--acc);font-weight:600">¿Olvidaste tu contraseña?</a></div>`;
 $('#lock').style.display='flex';
 ['l_u','l_p'].forEach(i=>document.getElementById(i).addEventListener('keydown',ev=>{if(ev.key==='Enter')doAuth()}));
}
function viewRecupera(){
 const correo=(($('#l_u')||{}).value||'').trim();
 $('#lbox').innerHTML=`<h2 style="margin:0 0 4px">🔧 GL Multitienda</h2><div class="mu">Recuperar contraseña</div>
  <div class="mu" style="margin-top:8px">Escribe el correo con el que te registraste y te enviamos un enlace para poner una contraseña nueva.</div>
  <label>Correo</label><input id="r_u" type="email" autocomplete="username" autocapitalize="none" placeholder="tu@correo.com" value="${esc(correo)}">
  <div id="l_e" style="color:var(--danger);min-height:20px;margin:8px 0"></div>
  <button class="btn" style="width:100%" onclick="doReset()">Enviar correo de recuperación</button>
  <div class="row" style="margin:10px 0 0;justify-content:center"><a href="#" onclick="lockUI();return false" style="color:var(--acc);font-weight:600">Volver al inicio de sesión</a></div>`;
 $('#lock').style.display='flex';
 document.getElementById('r_u').addEventListener('keydown',ev=>{if(ev.key==='Enter')doReset()});
}
async function doReset(){
 const box=document.getElementById('l_e'),u=document.getElementById('r_u').value.trim();
 box.textContent='';
 if(!u||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(u)){box.textContent='Escribe un correo válido';return}
 try{
  await FB.reset(u,location.origin+location.pathname);
  $('#lbox').innerHTML=`<h2 style="margin:0 0 4px">🔧 GL Multitienda</h2>
   <div style="font-size:19px;font-weight:700;color:var(--ok)">✓ Correo enviado</div>
   <div class="mu" style="margin-top:8px">Si <b>${esc(u)}</b> está registrado, en unos minutos te llega un correo con un enlace para crear una contraseña nueva.<br><br>Revisa también la carpeta de correo no deseado o spam, porque a veces se cueda ahí.</div>
   <button class="btn" style="width:100%;margin-top:14px" onclick="lockUI()">Volver al inicio de sesión</button>`;
 }catch(x){
  const c=(x&&x.code)||'';
  box.textContent=/too-many-requests/i.test(c)?'Ya se enviaron demasiados correos. Espera unos minutos e inténtalo otra vez.'
   :/invalid-email|missing-email/i.test(c)?'Ese correo no es válido.'
   :/network-request-failed|network/i.test(c)?'Sin conexión. Revisa tu internet y prueba de nuevo.'
   :'No se pudo enviar el correo. Inténtalo de nuevo en unos minutos.';
 }
}
async function doAuth(){
 const e=$('#l_e');e.textContent='';
 try{await FB.login($('#l_u').value.trim(),$('#l_p').value)}
 catch(x){e.textContent=/invalid|wrong|credential|user-not-found/i.test((x&&x.code)||'')?'Correo o contraseña incorrectos':'No se pudo entrar: '+((x&&x.code)||'error')}
}
function logout(){FB.logout().then(()=>location.reload())}
function boot(){FB.onAuth(u=>{if(u){USER=u;R=FB.R;$('#lock').style.display='none';if(!synced){synced=true;sync()}}else{R=null;lockUI()}})}
loadSet();loadRate();fetchRate();setInterval(()=>fetchRate(),30*60*1000);
window.FB?boot():window.addEventListener('fbready',boot);
function sync(){
 const upd=()=>{cart=cart.filter(c=>find(c.id));const m=$('#modal').classList.contains('on'),a=document.activeElement;if(!m&&!(a&&a.tagName==='INPUT'))render();else refreshList()};
 R.collection('parts').onSnapshot(s=>{
  db.parts=s.docs.map(d=>({ts:0,...d.data()})).sort((a,b)=>b.ts-a.ts);
  $('#st').textContent='☁ Sincronizado';
  if(!mig){mig=true;if(s.empty&&LOC.parts.length&&confirm('Se encontraron '+LOC.parts.length+' repuestos guardados en este dispositivo. ¿Subirlos a la nube para sincronizarlos?'))commit(LOC.parts.map((p,i)=>({ts:Date.now()-i,...p})),LOC.notes)}
  upd()},()=>{$('#st').textContent='Error de sincronización'});
 let unN=null;const cut=new Date(Date.now()-60*864e5).toISOString();
 const watchNotes=()=>{if(unN)unN();unN=R.collection('notes',notesAll?null:['date','>=',cut]).onSnapshot(s=>{
  db.notes=s.docs.map(d=>({...d.data()})).sort((a,b)=>b.no-a.no);
  if(notesAll){window._nAll=true;const mx=Math.max(0,...db.notes.map(x=>x.no));if(mx>SEQ){SEQ=mx;R.doc('config/seq').set({n:SEQ}).catch(se)}}
  upd()},()=>{})};
 window.loadAllNotes=()=>{notesAll=true;watchNotes()};
 R.doc('config/seq').onSnapshot(s=>{if(s.exists){SEQ=Math.max(SEQ,s.data().n||0)}else if(!notesAll){notesAll=true;watchNotes()}},()=>{});
 watchNotes();
 R.doc('config/prices').onSnapshot(s=>{if(s.exists){SET={...SET,...s.data()};parUI();upd()}},()=>{});
 R.doc('config/logo').onSnapshot(s=>{LOGO=s.exists?{...s.data()}:null;upd()},()=>{});
}
</script>
