<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GL Multitienda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lock">
    <div class="box" id="lbox" style="max-width:380px">
      <h2 style="margin:0">?? GL Multitienda</h2>
      <p class="mu">Cargando…</p>
    </div>
  </div>
  
  <header>
    <div id="st" style="position:fixed;top:10px;left:10px;z-index:100">☐ Sincronizando</div>
  </header>
  
  <main id="app"></main>
  
  <div id="modal" style="display:none">
    <div id="box" style="max-width:640px;margin:20px auto;padding:20px;background:var(--bg);border-radius:10px"></div>
  </div>

  <script>
    // Configuración y datos iniciales
    const SET = {
      mode: 'cash',
      difMan: '',
      par: 0,
      disc: 10,
      ml: 15,
      oth: 2
    };
    let USER = null;
    let Rate = 871.3689;
    let DATOS = {
      telefono: '04129431072',
      email: 'Grupoventasgl@gmail.com',
      frase: 'Repuestos originales y de reemplazo de la mejor calidad del mercado'
    };
    let db = { notes: [], compras: [], parts: [] };
    
    // Esperar a que el DOM esté listo
    document.addEventListener('DOMContentLoaded', (e) => {
      // Mostrar vista principal si ya hay datos
      const lock = document.getElementById('lock');
      const app = document.getElementById('app');
      if (lock && app) {
        // Si ya hay datos guardados, mostrar la app
        if (db.notes.length > 0 || db.compras.length > 0) {
          lock.style.display = 'none';
          // Renderizar vista de inventario básico
          app.innerHTML = '<div style="padding:20px"><h3>GL Multitienda</h3><p>Sistema activo. Ve a Compras para ver notas.</p></div>';
        } else {
          // Mostrar pantalla de login
          lock.style.display = 'flex';
        }
      }
    });
    
    // Funciones básicas
    function esc(t){return t.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
    function fmtFec(x){const m=x&&/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||''));return m?m[3]+'/'+m[2]+'/'+m[1]:'';}
    function money(n){return (+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function bsf(n){return (+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
    
    // Función para cargar datos de localStorage
    function cargarDatos(){
      try {
        const saved = localStorage.getItem('glm_db');
        if (saved) { const d = JSON.parse(saved); db.notes = d.notes || []; db.compras = d.compras || []; db.parts = d.parts || []; }
      } catch(e) {}
    }
    
    // Cargar al iniciar
    cargarDatos();
    
    // Console log para depuración
    console.log('GL Multitienda iniciado - v14');
  </script>
</body>
</html>
