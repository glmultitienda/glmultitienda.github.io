<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GL Multitienda</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="lock">
    <div class="box" id="lbox" style="max-width:380px">
      <h2 style="margin:0">?? GL Multitienda</h2>
      <p class="mu">Cargando… (v14 · 06/10/2026)</p>
    </div>
  </div>
  
  <header>
    <div id="st" style="position:fixed;top:10px;left:10px;z-index:100">☁ Sincronizando...</div>
  </header>
  
  <main id="app"></main>
  
  <div id="modal" style="display:none">
    <div id="box" style="max-width:640px;margin:20px auto;padding:20px;background:var(--bg);border-radius:10px"></div>
  </div>

  <script>
    // ==========================================
    // CONFIGURACIÓN Y DATOS
    // ==========================================
    const SET = {
      mode: 'cash',
      difMan: '',
      par: 0,
      disc: 10,
      ml: 15,
      oth: 2,
      admin: false,
      adminPassword: ''
    };
    let USER = null;
    let R = null;
    let Rate = 871.3689;
    let RATE_INFO = null;
    let RATE_MAN = false;
    let RATE_MAN_DATE = '';
    let DATOS = {
      telefono: '04129431072',
      email: 'Grupoventasgl@gmail.com',
      frase: 'Repuestos originales y de reemplazo de la mejor calidad del mercado',
      marcas: []
    };
    let LOGO = null;
    let db = { notes: [], compras: [], parts: [] };
    let seq = 0;
    let isAdmin = () => false;
    
    // ==========================================
    // INICIALIZACIÓN
    // ==========================================
    document.addEventListener('DOMContentLoaded', () => {
      const st = document.getElementById('st');
      const urlParams = new URLSearchParams(window.location.search);
      const isGitHubPages = window.location.hostname.includes('github.io');
      
      // Verificar versión
      const versionTag = 'v14 · 06/10/2026';
      const lbox = document.getElementById('lbox');
      if (lbox) {
        lbox.innerHTML = `<h2 style="margin:0 0 4px">🔧 GL Multitienda</h2><p class="mu">Cargando… (${versionTag})</p>`;
      }
      
      // Mostrar versión en st
      if (st) st.textContent = '☁ Sincronizado · v14';
      
      // Firebase initialization (simulated for local)
      const isFirebaseAvailable = typeof R !== 'undefined';
      if (isFirebaseAvailable) {
        R.onSnapshot(() => { /* actualizar db */ });
      }
      
      // Cargar datos de localStorage
      const savedDb = localStorage.getItem('glm_db');
      if (savedDb) try { db = JSON.parse(savedDb); } catch(e) {}
      db.notes = db.notes || [];
      db.compras = db.compras || [];
      db.parts = db.parts || [];
      
      // Cargar datos de configuración
      const savedDatos = localStorage.getItem('glm_datos');
      if (savedDatos) try { DATOS = JSON.parse(savedDatos); } catch(e) {}
      
      const savedLogo = localStorage.getItem('glm_logo');
      if (savedLogo) try { LOGO = JSON.parse(savedLogo); } catch(e) {}
      
      const savedSet = localStorage.getItem('glm_set');
      if (savedSet) try { SET['...'] = JSON.parse(savedSet); } catch(e) {}
      
      // Mostrar u ocultar login según corresponda
      const lock = document.getElementById('lock');
      const app = document.getElementById('app');
      if (lock) {
        // Si hay datos, mostrar app directamente
        if (db.notes.length > 0 || db.compras.length > 0) {
          lock.style.display = 'none';
          render();
        }
      }
    });
    
    // ==========================================
    // FUNCIONES AUXILIARES
    // ==========================================
    function esc(t){return t.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>');}
    function fmtFec(x){const m=x&&/^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||''));return m?m[3]+'/'+m[2]+'/'+m[1]:(x?String(x):'');}
    function bnum(v){let s=String(v==null?'':v).trim().replace(/[^\d.,-]/g,'');if(!s)return NaN;}
    function bprecio(t){return Math.round((+t||0)*100)/100;}
    function money(n){return (+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function bsf(n){return (+n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function hoy(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
    function esDoc(x){return /^(\d{4})-(\d{2})-(\d{2})/.exec(String(x||''))||null}
    function esDocInput(id){const v=document.getElementById(id||'').value||'';return esDoc(v)}
    function fmtMonedaInput(id){const i=document.getElementById(id||'');if(!i)return;let v=i.value||'';v=v.replace(/\s/g,'');if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');i.value=v}
    
    // ==========================================
    // FUNCIONES DE COMPRAS (ACTUALIZADAS)
    // ==========================================
    
    // FUNCIÓN PRINCIPAL: Guardar cambios en nota de compra
    function guardarCompra(id){
      // Paso 1: Confirmación de ejecución
      alert('🟢 guardarCompra INICIADO con id: ' + id);
      
      try {
        // Paso 2: Buscar la nota en db.compras
        const c=(db.compras||[]).find(x=>x.id===id);if(!c){ alert('❌ No se encontró la nota con id '+id); return; }
        alert('📝 Nota encontrada: proveedor=' + (c.proveedor||'VACÍO'));
        
        // Paso 3: Verificar inputs del modal existen
        const $eProveedor = $('#ecProveedor');
        const $eFecha = $('#ecFecha');  
        const $eRecibido = $('#ecRecibido');
        const $ePago = $('#ecPago');
        const $eVence = $('#ecVence');
        
        if(!$eProveedor.length){ alert('❌ Input ecProveedor NO encontrado en el DOM'); return; }
        if(!$eFecha.length){ alert('❌ Input ecFecha NO encontrado en el DOM'); return; }
        
        // Paso 4: Obtener valores de los inputs
        const nuevoProveedor = $eProveedor.val().trim()||c.proveedor||'Sin proveedor';
        const nuevaFecha = $eFecha.val().trim()||c.fecha;
        const nuevoRecibido = $eRecibido.val().trim()||c.recibido;
        const nuevoPago = $ePago.val()||c.credito||'contado';
        const nuevaVence = $eVence.val().trim()||c.vence;
        
        // Paso 5: Actualizar objeto de la nota
        c.proveedor = nuevoProveedor;
        c.fecha = nuevaFecha;
        c.recibido = nuevoRecibido;
        c.credito = nuevoPago;
        c.vence = nuevaVence;
        
        alert('💾 Datos actualizados en el objeto de la nota - Proveedor: ' + nuevoProveedor);
        
        // Paso 6: Guardar en Firebase o localStorage
        if(typeof R !== 'undefined' && R && R.doc){
          try{
            R.doc('compras/'+id).set(JSON.parse(JSON.stringify(c))).catch(function(err){ alert('❌ Error al guardar en Firebase: ' + err.message); });
          }catch(e){
            alert('💾 Guardando en localStorage (Firebase error)');
            save();
          }
        } else {
          alert('💾 Guardando en localStorage...');
          save();
        }
        
        // Paso 7: Cerrar modal y refrescar lista
        closeM();
        renderCompras();
        alert('✅ Nota de compra actualizada correctamente.');
        
      } catch(e) {
        alert('💥 ERROR INESPERADO EN guardarCompra: ' + String(e).slice(0,300));
      }
    }
    
    // FUNCIÓN: Abrir modal para editar nota de compra
    function editarCompra(id){
      const c=(db.compras||[]).find(x=>x.id===id);if(!c)return;
      const proveedorAct=c.proveedor||'';
      const fechaAct=c.fecha||new Date().toISOString().split('T')[0];
      const recibidoAct=c.recibido||'';
      const creditoAct=c.credito||'contado';
      const venceAct=c.vence||'';
      
      $('#box').innerHTML=`<div style="max-width:640px;margin:20px auto;padding:20px;background:var(--bg);border-radius:10px">
        <h3 style="margin:0 0 16px">✏️ Editar nota de compra ${c.num?'N.º '+c.num:''}</h3>
        <div class="row" style="margin:6px 0"><label style="display:block;margin-bottom:4px">Proveedor</label><input type="text" id="ecProveedor" value="${esc(proveedorAct)}" style="width:100%;padding:6px;border-radius:4px;border:1px solid var(--bd)"></div>
        <div class="row" style="margin:6px 0"><label style="display:block;margin-bottom:4px">Fecha de la nota</label><input type="date" id="ecFecha" value="${fechaAct}" style="width:100%;padding:6px;border-radius:4px;border:1px solid var(--bd)"></div>
        <div class="row" style="margin:6px 0"><label style="display:block;margin-bottom:4px">Fecha de recepción</label><input type="date" id="ecRecibido" value="${recibidoAct}" style="width:100%;padding:6px;border-radius:4px;border:1px solid var(--bd)"></div>
        <div class="row" style="margin:6px 0"><label style="display:block;margin-bottom:4px">Forma de pago</label>
        <select id="ecPago" style="width:100%;padding:6px;border-radius:4px;border:1px solid var(--bd)">
          <option value="contado" ${creditoAct==='contado'?'selected':''}>Contado</option>
          <option value="credito" ${creditoAct==='credito'?'selected':''}>A crédito</option>
        </select></div>
        ${venceAct?`<div class="row" style="margin:6px 0"><label style="display:block;margin-bottom:4px">Vence (crédito)</label><input type="date" id="ecVence" value="${venceAct}" style="width:100%;padding:6px;border-radius:4px;border:1px var(--bd)"></div>`:''}
        <div style="margin-top:24px;display:flex;gap:8px">
          <button class="btn g" onclick="guardarCompra('${c.id}')">✅ Guardar cambios</button>
          <button class="btn" onclick="renderCompras();$('#modal').classList.remove('on')">❌ Cancelar</button>
        </div></div>`;
      $('#modal').classList.add('on');
    }
    
    // FUNCIÓN: Cerrar modal
    function closeM(){$('#modal').classList.remove('on')}
    
    // FUNCIÓN: Renderizar lista de compras
    function renderCompras(){
      const L=db.compras||[];
      const anul=L.filter(c=>c.anulado).length;
      if(!L.length){$('#app').innerHTML='<div class="empty">Todavía no hay notas de compra.<br><br>Ve a Inventario y pulsa <b>📥 Carga rápida</b> para registrar la primera.</div>';return}
      $('#app').innerHTML=`<div class="row" style="margin:0 0 10px"><span class="mu">${L.length} nota(s)${anul?' · '+anul+' anulada(s)':''}</span>
        <span style="flex:1"></span>${anul?`<button class="btn g s" style="color:var(--danger)" onclick="purgaAnuladas()">🗑 Borrar las ${anul} anuladas</button>`:''}</div>`
        +L.map(c=>{const d=c.credito==='credito'?diasVence(c.vence):null;
          let est='';
          if(d!=null&&d<0)est=`<span class="tag zero">Vencida hace ${-d} día(s)</span>`;
          else if(d!=null&&d<=7)est=`<span class="tag low">Vence en ${d} día(s)</span>`;
          else if(d!=null)est=`<span class="tag">Vence ${fmtFec(c.vence)}</span>`;
          if(c.anulado)est=`<span class="tag zero">ANULADA</span>`+est;
          return `<div class="card" style="margin-bottom:10px;flex-direction:column;align-items:stretch;cursor:pointer;${c.anulado?'opacity:.7':''}" onclick="showCompra('${c.id}')">
            <div class="row" style="margin:0;justify-content:space-between"><b style="${c.anulado?'text-decoration:line-through':''}">${esc(c.proveedor||'Sin proveedor')}${c.num?' · N.º '+c.num:''}</b>
            <b style="${c.anulado?'text-decoration:line-through;color:var(--danger)':''}">${money(c.total||0)}</b></div>
            <div class="mu">Nota ${fmtFec(c.fecha)} · recibida ${fmtFec(c.recibido)} · ${(c.items||[]).length} art · ${c.unidades||0} uds${c.credito==='credito'?' · A crédito':' · Contado'}</div>
            <div style="margin-top:6px">${est}</div></div>`}).join('');
    }
    
    // FUNCIÓN: Mostrar detalle de nota de compra
    function showCompra(id){
      const c=(db.compras||[]).find(x=>x.id===id);if(!c)return;
      const d=c.credito==='credito'?diasVence(c.vence):null;
      $('#box').innerHTML=`<div style="max-width:640px;margin:20px auto;padding:20px;background:var(--bg);border-radius:10px">
        <h3 style="margin:0">Nota de compra ${c.num?'N.º '+c.num:''}${c.anulado?' <span style="color:var(--danger);font-size:14px">· ANULADA</span>':''}</h3>
        <div class="mu" style="margin-top:4px">${esc(c.proveedor||'')}</div>
        <div class="mu" style="margin-top:8px">Fecha de la nota: <b>${fmtFec(c.fecha)||'—'}</b><br>
        Fecha de recepción: <b>${fmtFec(c.recibido)||'—'}</b><br>
        Forma de pago: <b>${c.credito==='credito'?'A crédito':'Contado'}</b>
        ${c.credito==='credito'?`<br>Vence: <b>${fmtFec(c.vence)||'—'}</b> ${d!=null?(d<0?'<span style="color:var(--pr)">(vencida)':'(faltan '+d+' días)'):''}`:''}
        <br>Total de la nota: <b>${money(c.total||0)}</b> · ${(c.items||[]).length} artículos · ${c.unidades||0} unidades</div>
        ${c.anulado&&c.anuladoDate?`<div class="mu" style="color:var(--danger)">Anulada el ${fmtFec(c.anuladoDate)}</div>`:''}
        ${c.foto?`<img src="${c.foto}" style="width:100%;border-radius:10px;margin-top:12px;border:1px solid var(--bd)">`:''}
        <div class="mu" style="margin-top:6px">${c.confianza!=null?'Confianza del lector automático: '+c.confianza+'%. Las cantidades y costos fueron revisados.':'Cargado sin lector automático.'}</div>
        <div style="margin-top:12px;max-height:230px;overflow:auto"><table class="note" style="margin:0">
          <tr><th>Código</th><th>Descripción</th><th class="r">Cant</th><th class="r">Costo</th></tr>
          ${(c.items||[]).map(i=>`<tr><td>${esc(i.code||'')}</td><td>${esc(i.name)}</td><td class="r">${i.qty}</td><td class="r">${money(i.cost)}</td></tr>`).join('')}
        </table></div>
        <div class="row noprint" style="margin-top:14px">
          ${c.anulado?`<button class="btn g" onclick="anularCompra('${c.id}',false)">↩ Reactivar nota</button>`
          :`<button class="btn g" style="color:var(--danger)" onclick="anularCompra('${c.id}',true)">⊘ Anular nota</button>`}
          <button class="btn g" onclick="verArt('${c.id}')">Ver artículos</button>
          ${c.foto?`<button class="btn g" onclick="descNota('${c.id}')">Ver la foto</button>`:''}
          <span style="flex:1"></span>
          <button class="btn g" onclick="editarCompra('${c.id}')">✏️ Editar</button>
          <button class="btn g" onclick="delCompra('${c.id}',true)">Solo la nota</button>
          <button class="btn" style="background:var(--danger)" onclick="delCompra('${c.id}',false)">Nota + artículos</button></div>
        <div class="mu" style="margin-top:6px">Anular deja la nota marcada pero sus artículos siguen en el inventario. Borrar la quita de la lista; "Nota + artículos" borra también lo que creó.</div></div>`;
      $('#modal').classList.add('on');
    }
    
    // FUNCIÓN: Anular/Reactivar nota
    function anularCompra(id,on){
      const c=(db.compras||[]).find(x=>x.id===id);if(!c)return;
      if(on&&!confirm('¿Anular la nota'+(c.num?' N.º '+c.num:'')+'?\n\nQueda marcada como ANULADA, pero sus artículos siguen en el inventario y la nota no se borra.\n\nPodrás borrarla después si quieres.'))return;
      c.anulado=!!on;c.anuladoDate=on?new Date().toISOString():null;
      if(R)R.doc('compras/'+id).set(JSON.parse(JSON.stringify(c))).catch(se);else save();
      closeM();renderCompras();
      if(!on)alert('Nota reactivada.');
    }
    
    // FUNCIÓN: Borrar notas anuladas
    function purgaAnuladas(){
      let borrados=0;const conservados=[];
      (db.compras||[]).forEach(c=>{
        if(c.anulado){
          const arts=c.items||[];
          // Eliminar partes del inventario
          arts.forEach(it=>{
            const p=db.parts.find(x=>x.id===it.id);
            if(p){ borrados++; db.parts=db.parts.filter(p2=>p2.id!==p.id); }
          });
          db.compras=db.compras.filter(x=>x.id!==c.id);
          if(R)R.doc('compras/'+c.id).delete().catch(se);else save();
        }
      });
      renderCompras();
      alert('Borradas '+borrados+' notas anuladas.');
    }
    
    // FUNCIÓN: Guardar en localStorage
    function save(){try{localStorage.setItem('glm_db',JSON.stringify(db));alert('Guardado en localStorage.');}catch(e){alert('Error: almacenamiento lleno.');}}
    
    // ==========================================
    // FUNCIONES DEL SISTEMA (simplificadas)
    // ==========================================
    
    function render(){/*...renderizado general...*/}
    function refreshList(){/*...refrescar listados...*/}
    function rateUI(){/*...actualizar tasas...*/}
    function calcFrom(k){/*...calculos BCV...*/}
    function saveRate(){try{localStorage.setItem('glm_rate',JSON.stringify({rate:Rate,man:RATE_MAN,info:RATE_INFO}))}catch(e){}rateUI()}
    function loadRate(){try{const t=JSON.parse(localStorage.getItem('glm_rate')||'null');if(t&&t.rate>0){Rate=t.rate;RATE_INFO=t.info||null;RATE_MAN=!!t.man&&!!t.info&&t.info.manDate===new Date().toISOString().slice(0,10)}}catch(e){}rateUI()}
    function pf(n){return (+n||0).toLocaleString('de-DE',{maximumFractionDigits:2})+'%'}
    function difPct(){return SET.difMan!==''&&SET.difMan!=null&&!isNaN(+SET.difMan)?+SET.difMan:0}
    function cashOf(bcv){return Math.round((+bcv||0)*(1-(+SET.disc||0)/100)*100)/100}
    function mlF(mode){const a=(+SET.ml||0)/100,b=(+SET.oth||0)/100;return mode==='net'?1/((1-a)*(1-b)):(1+a)*(1+b)}
    function mlPrice(cash){return cash*mlF(SET.mode)}
    function mlFmt(n){return n.toLocaleString('de-DE',{minimumFractionDigits:4,maximumFractionDigits:4})}
    function mlTxt(v){v=+v;return v>0?(RATE?'≈ Bs '+bsf(v*RATE)+' al BCV · ':'')+'CASH '+mlFmt(mlF(SET.mode))+' (× '+pf(SET.ml)+' y luego × '+pf(SET.oth)+')':''}
    function parUI(){const b=document.getElementById('parBtn');if(b)b.textContent=SET.par>0||SET.difMan!==''?'📈 Paralelo '+(SET.par>0?bsf(SET.par):'')+' (+'+pf(difPct())+')':'📈 Paralelo: definir'}

    function ganTxt(c,a,b){if(!isAdmin()||!(+c>0))return '';const g=v=>money(v-c)+' ('+Math.round((v-c)/c*100)+'%)';return 'Ganancia BCV: '+g(+b||0)+' · CASH: '+g(+a||0)}
    function ganPrev(){const bs=document.getElementById('f_bs'),pb=document.getElementById('f_pbcv'),ml=document.getElementById('f_ml'),pm=document.getElementById('f_pml');if(bs&&pb)bs.textContent=bsTxt(pb.value);if(ml&&pm)ml.textContent=mlTxt(pm.value);const e=document.getElementById('f_gan'),c=document.getElementById('f_cost');if(e&&c)e.textContent=ganTxt(c.value,document.getElementById('f_pcash').value,document.getElementById('f_pbcv').value)}

      $('#box').innerHTML=`<img src="${p.img}" alt="" style="width:100%;max-height:75vh;object-fit:contain;border-radius:10px;background:var(--bg)"><div style="margin:10px 0"><b>${esc(p.name)}</b><div class="mu">${esc(p.code)}</div></div><button class="btn g" onclick="closeM()">Cerrar</button>`;
